<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Classifica Live - Karaoke Live Show</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  color:white;

  background:
    radial-gradient(circle at 15% 15%,rgba(255,0,200,.25),transparent 30%),
    radial-gradient(circle at 85% 20%,rgba(0,180,255,.25),transparent 30%),
    linear-gradient(135deg,#050713,#11143b,#080716);
}

.screen{
  width:100%;
  min-height:100vh;
  padding:24px 4vw 40px;
}

.topbar{
  width:100%;
  margin-bottom:18px;
}

.back-site{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  min-height:48px;

  padding:0 18px;

  border-radius:13px;

  text-decoration:none;

  color:white;

  font-weight:900;

  font-size:16px;

  background:rgba(255,255,255,.10);

  border:1px solid rgba(255,255,255,.16);
}

.back-site:hover{
  background:rgba(255,255,255,.16);
}

.header{
  text-align:center;
  margin-bottom:30px;
}

.logo{
  font-size:clamp(32px,4.5vw,68px);
  font-weight:900;
  letter-spacing:2px;
}

.live{
  color:#ffd400;
  text-shadow:0 0 20px #ff9d00;
}

.title{
  margin-top:10px;

  color:#ffd400;

  font-size:clamp(26px,3.6vw,52px);

  font-weight:900;
}

.subtitle{
  margin-top:8px;

  font-size:clamp(14px,1.4vw,22px);

  color:#ddd;
}

.ranking{
  width:100%;
  max-width:1500px;
  margin:auto;
}

.row{
  display:grid;

  grid-template-columns:
    100px
    1fr
    230px;

  align-items:center;

  gap:20px;

  margin:14px 0;

  padding:18px 28px;

  border-radius:22px;

  background:rgba(255,255,255,.08);

  border:1px solid rgba(255,255,255,.14);
}

.row.first{
  border:3px solid #ffd400;
  background:rgba(255,212,0,.12);
}

.row.second{
  border:2px solid #d8d8d8;
}

.row.third{
  border:2px solid #cd7f32;
}

.position{
  text-align:center;

  font-size:clamp(32px,3.8vw,64px);

  font-weight:900;
}

.info{
  min-width:0;
}

.name{
  font-size:clamp(26px,2.8vw,48px);

  font-weight:900;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.song{
  margin-top:7px;

  color:#ffd400;

  font-size:clamp(16px,1.6vw,27px);

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.score{
  text-align:right;
}

.average{
  color:#ffd400;

  font-size:clamp(28px,3vw,50px);

  font-weight:900;
}

.votes{
  margin-top:5px;

  color:#ddd;

  font-size:clamp(14px,1.3vw,21px);
}

.empty{
  text-align:center;

  margin-top:12vh;

  color:#ddd;

  font-size:clamp(24px,3.5vw,48px);
}

.footer{
  text-align:center;

  margin-top:30px;

  color:#aaa;

  font-size:clamp(12px,1.1vw,18px);
}

@media(max-width:700px){

  .screen{
    padding:16px 12px 30px;
  }

  .row{
    grid-template-columns:
      55px
      1fr
      90px;

    gap:10px;

    padding:14px 12px;
  }

  .name{
    font-size:20px;
  }

  .song{
    font-size:14px;
  }

  .average{
    font-size:21px;
  }

  .votes{
    font-size:11px;
  }

  .position{
    font-size:26px;
  }
}
</style>
</head>

<body>

<div class="screen">

<div class="topbar">

  <a
  class="back-site"
  href="sito.html">
    ← TORNA AL SITO
  </a>

</div>


<div class="header">

  <div class="logo">
    🎤 KARAOKE
    <span class="live">LIVE</span>
    SHOW
  </div>

  <div class="title">
    🏆 CLASSIFICA LIVE
  </div>

  <div class="subtitle">
    La tua voce, la nostra emozione
  </div>

</div>


<div
class="ranking"
id="ranking">

  <div class="empty">
    In attesa della gara...
  </div>

</div>


<div class="footer">
  AGGIORNAMENTO AUTOMATICO IN TEMPO REALE
</div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";


const firebaseConfig = {

  apiKey:
  "AIzaSyCHVOquom1j9D-0CzEzOlT3V3JpiHFIaII",

  authDomain:
  "karaoke-live-show-12421.firebaseapp.com",

  databaseURL:
  "https://karaoke-live-show-12421-default-rtdb.firebaseio.com",

  projectId:
  "karaoke-live-show-12421",

  storageBucket:
  "karaoke-live-show-12421.firebasestorage.app",

  messagingSenderId:
  "522751685586",

  appId:
  "1:522751685586:web:6b7e65ab23f05ca0fb4e0b"
};


const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);

const ranking =
document.getElementById("ranking");


onValue(
ref(db,"concorrenti"),
snapshot=>{

  const data =
  snapshot.val() || {};

  const concorrenti =
  Object.entries(data)
  .map(([id,c])=>{

    const voti =
    Number(c.voti || 0);

    const totale =
    Number(c.totale || 0);

    return{

      id:id,

      nome:
      c.nome || "Senza nome",

      canzone:
      c.canzone || "",

      voti:voti,

      media:
      voti > 0
      ? totale / voti
      : 0

    };

  });


  concorrenti.sort(
    (a,b)=>
    b.media-a.media
    ||
    b.voti-a.voti
  );


  ranking.innerHTML="";


  if(
    concorrenti.length === 0
  ){

    const empty =
    document.createElement("div");

    empty.className="empty";

    empty.textContent=
    "In attesa della gara...";

    ranking.appendChild(empty);

    return;
  }


  concorrenti.forEach(
  (c,index)=>{

    const row =
    document.createElement("div");

    row.className="row";


    if(index===0){
      row.classList.add("first");
    }

    if(index===1){
      row.classList.add("second");
    }

    if(index===2){
      row.classList.add("third");
    }


    const position =
    document.createElement("div");

    position.className=
    "position";


    if(index===0){

      position.textContent="🥇";

    }else if(index===1){

      position.textContent="🥈";

    }else if(index===2){

      position.textContent="🥉";

    }else{

      position.textContent=
      (index+1)+"°";

    }


    const info =
    document.createElement("div");

    info.className="info";


    const name =
    document.createElement("div");

    name.className="name";

    name.textContent=
    c.nome;


    const song =
    document.createElement("div");

    song.className="song";

    song.textContent=
    c.canzone
    ? "🎵 "+c.canzone
    : "";


    info.appendChild(name);

    info.appendChild(song);


    const score =
    document.createElement("div");

    score.className="score";


    const average =
    document.createElement("div");

    average.className="average";

    average.textContent=
    "⭐ "+c.media.toFixed(1);


    const votes =
    document.createElement("div");

    votes.className="votes";

    votes.textContent=
    c.voti
    +
    (c.voti===1
      ? " voto"
      : " voti");


    score.appendChild(average);

    score.appendChild(votes);


    row.appendChild(position);

    row.appendChild(info);

    row.appendChild(score);


    ranking.appendChild(row);

  });

});

</script>

</body>
</html>
