<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Karaoke Live Show</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(255,0,255,.28), transparent 28%),
        radial-gradient(circle at 80% 15%, rgba(0,180,255,.25), transparent 30%),
        linear-gradient(180deg, #080816, #111126 45%, #090913);
      color: white;
      min-height: 100vh;
    }

    .app {
      max-width: 560px;
      margin: auto;
      padding: 18px 14px 30px;
    }

    .brand {
      text-align: center;
      margin: 6px 0 18px;
    }

    .brand h1 {
      margin: 0;
      font-size: 42px;
      font-weight: 900;
    }

    .live {
      color: #ffd23f;
      text-shadow: 0 0 12px #ff9c00;
    }

    .tag {
      margin-top: 8px;
      color: #ffd23f;
      font-weight: bold;
    }

    .video-wrap {
      border: 2px solid #ffd23f;
      border-radius: 22px;
      overflow: hidden;
      background: black;
      box-shadow: 0 0 25px rgba(255,210,63,.25);
    }

    .video-wrap iframe {
      width: 100%;
      height: 300px;
      border: 0;
      display: block;
      background: black;
    }

    .card {
      margin-top: 18px;
      padding: 16px;
      border-radius: 18px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.12);
    }

    .current-label {
      text-align: center;
      color: #ddd;
      font-size: 13px;
      font-weight: bold;
    }

    .current-name {
      text-align: center;
      color: #ffd23f;
      font-size: 28px;
      font-weight: 900;
      margin-top: 6px;
      text-transform: uppercase;
    }

    .vote-title {
      text-align: center;
      margin: 18px 0 8px;
      font-size: 28px;
      font-weight: 900;
      color: #ffd23f;
    }

    .vote-sub {
      text-align: center;
      margin-bottom: 16px;
      color: #ddd;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .vote-btn {
      border: 0;
      border-radius: 16px;
      padding: 16px 0;
      font-size: 30px;
      font-weight: 900;
      color: white;
      cursor: pointer;
      background: linear-gradient(180deg, #39125e, #15061f);
      box-shadow: inset 0 0 0 2px #ff3df2, 0 0 16px rgba(255,61,242,.35);
    }

    .vote-btn:nth-child(2n) {
      box-shadow: inset 0 0 0 2px #00d4ff, 0 0 16px rgba(0,212,255,.35);
    }

    .vote-btn:nth-child(3n) {
      box-shadow: inset 0 0 0 2px #ffd23f, 0 0 16px rgba(255,210,63,.35);
    }

    .vote-btn:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    .status {
      margin-top: 14px;
      padding: 12px;
      border-radius: 12px;
      background: rgba(255,255,255,.06);
      text-align: center;
    }

    .rank-title {
      text-align: center;
      color: #ffd23f;
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .rank-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 12px;
      margin: 8px 0;
      background: #241b55;
      border-radius: 12px;
    }

    .rank-pos {
      font-weight: 900;
      color: #ffd23f;
      min-width: 42px;
    }

    .rank-name {
      flex: 1;
      text-align: left;
      font-weight: 800;
    }

    .rank-score {
      text-align: right;
    }

    .closed {
      color: #ff7a9a;
      font-weight: bold;
    }

    .open {
      color: #52ff8a;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      color: #cfcfe5;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="brand">
    <h1>KARAOKE <span class="live">LIVE</span> SHOW</h1>
    <div class="tag">La tua voce, la nostra emozione</div>
  </div>

  <div class="video-wrap">
    <iframe
      src="https://vdo.ninja/?view=sgBmC5c&label=KARAOKE_LIVE_SHOW"
      allow="autoplay; fullscreen; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>

  <div class="card">

    <div class="current-label">CONCORRENTE IN GARA</div>

    <div class="current-name" id="currentName">
      IN ATTESA
    </div>

    <div class="vote-title">
      DAI IL TUO VOTO
    </div>

    <div class="vote-sub">
      Scegli un numero da 1 a 10
    </div>

    <div class="grid">
      <button class="vote-btn" onclick="sendVote(1)">1</button>
      <button class="vote-btn" onclick="sendVote(2)">2</button>
      <button class="vote-btn" onclick="sendVote(3)">3</button>
      <button class="vote-btn" onclick="sendVote(4)">4</button>
      <button class="vote-btn" onclick="sendVote(5)">5</button>

      <button class="vote-btn" onclick="sendVote(6)">6</button>
      <button class="vote-btn" onclick="sendVote(7)">7</button>
      <button class="vote-btn" onclick="sendVote(8)">8</button>
      <button class="vote-btn" onclick="sendVote(9)">9</button>
      <button class="vote-btn" onclick="sendVote(10)">10</button>
    </div>

    <div class="status" id="status">
      In attesa dell'ADMIN...
    </div>

  </div>

  <div class="card">

    <div class="rank-title">
      🏆 CLASSIFICA LIVE
    </div>

    <div id="ranking">
      Nessun concorrente.
    </div>

  </div>

  <div class="footer">
    KARAOKE LIVE SHOW<br>
    Emozioni • Musica • Spettacolo
  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue,
  runTransaction
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";


const firebaseConfig = {

  apiKey: "AIzaSyCHVOquom1j9D-0CzEzOlT3V3JpiHFIaII",

  authDomain: "karaoke-live-show-12421.firebaseapp.com",

  databaseURL:
  "https://karaoke-live-show-12421-default-rtdb.firebaseio.com",

  projectId: "karaoke-live-show-12421",

  storageBucket:
  "karaoke-live-show-12421.firebasestorage.app",

  messagingSenderId:
  "522751685586",

  appId:
  "1:522751685586:web:6b7e65ab23f05ca0fb4e0b"

};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


let currentId = null;

let currentName = "";

let votingOpen = false;


function buttons() {

  return document.querySelectorAll(".vote-btn");

}


function refreshButtons() {

  const already =
    currentId
    ? localStorage.getItem("voted_" + currentId)
    : null;


  const disabled =
    !currentId ||
    !votingOpen ||
    already;


  buttons().forEach(button => {

    button.disabled = disabled;

  });


  const status =
    document.getElementById("status");


  if (!currentId) {

    status.innerHTML =
      '<span class="closed">Nessun concorrente attivo.</span>';

  }

  else if (!votingOpen) {

    status.innerHTML =
      '<span class="closed">Votazione chiusa.</span>';

  }

  else if (already) {

    status.textContent =
      "Hai già votato questo concorrente ✓";

  }

  else {

    status.innerHTML =
      '<span class="open">Votazione aperta.</span> Scegli da 1 a 10.';

  }

}


window.sendVote =
async function(voto) {


  if (!currentId) return;

  if (!votingOpen) return;


  if (
    localStorage.getItem(
      "voted_" + currentId
    )
  ) return;


  buttons().forEach(button => {

    button.disabled = true;

  });


  document.getElementById("status").textContent =
    "Invio voto " + voto + "...";


  const concorrenteRef =
    ref(
      db,
      "concorrenti/" + currentId
    );


  await runTransaction(
    concorrenteRef,
    concorrente => {


      if (concorrente) {

        concorrente.voti =
          (concorrente.voti || 0) + 1;


        concorrente.totale =
          (concorrente.totale || 0)
          + voto;

      }


      return concorrente;

    }
  );


  localStorage.setItem(
    "voted_" + currentId,
    voto
  );


  document.getElementById("status").textContent =
    "Voto " + voto + " registrato ✓";


  refreshButtons();

};


onValue(
  ref(db, "gara"),
  snapshot => {


    const gara =
      snapshot.val() || {};


    currentId =
      gara.currentId || null;


    currentName =
      gara.currentName || "";


    votingOpen =
      gara.votingOpen === true;


    document.getElementById(
      "currentName"
    ).textContent =
      currentName || "IN ATTESA";


    refreshButtons();

  }
);


onValue(
  ref(db, "concorrenti"),
  snapshot => {


    const dati =
      snapshot.val() || {};


    const concorrenti =
      Object.entries(dati)
      .map(([id, concorrente]) => {


        const voti =
          concorrente.voti || 0;


        const totale =
          concorrente.totale || 0;


        const media =
          voti > 0
          ? totale / voti
          : 0;


        return {

          id: id,

          nome:
            concorrente.nome
            || "Senza nome",

          voti: voti,

          media: media

        };

      });


    concorrenti.sort(
      (a, b) =>
        b.media - a.media
        ||
        b.voti - a.voti
    );


    const ranking =
      document.getElementById(
        "ranking"
      );


    if (
      concorrenti.length === 0
    ) {

      ranking.textContent =
        "Nessun concorrente.";

      return;

    }


    ranking.innerHTML =
      concorrenti
      .map((concorrente, posizione) => {


        let medaglia = "";


        if (posizione === 0)
          medaglia = "🥇";

        else if (posizione === 1)
          medaglia = "🥈";

        else if (posizione === 2)
          medaglia = "🥉";


        return `

          <div class="rank-row">

            <div class="rank-pos">

              ${medaglia || (posizione + 1) + "°"}

            </div>

            <div class="rank-name">

              ${concorrente.nome}

            </div>

            <div class="rank-score">

              ⭐ ${concorrente.media.toFixed(1)}

              <br>

              <small>

                ${concorrente.voti} voti

              </small>

            </div>

          </div>

        `;

      })
      .join("");

  }
);

</script>

</body>
</html>
