 <!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Karaoke Live Show</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(180deg,#07194d,#142a72,#09143d);
  color:white;
  min-height:100vh;
}

.app{
  max-width:780px;
  margin:auto;
  padding:25px 15px 50px;
}

h1{
  text-align:center;
  color:#ffd23f;
  font-size:38px;
  margin-bottom:5px;
}

h2{
  text-align:center;
  margin-top:5px;
}

.card{
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.15);
  border-radius:20px;
  padding:20px;
  margin-top:20px;
}

input{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  font-size:18px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:10px;
}

button{
  border:0;
  border-radius:12px;
  padding:14px 18px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.add{
  background:#13d8e8;
  color:#073348;
}

.start{
  background:#35e779;
  color:#063b1c;
}

.stop{
  background:#ffbd28;
  color:#4c3100;
}

.delete{
  background:#ff315d;
  color:white;
}

.reset{
  background:#ff315d;
  color:white;
  width:100%;
  margin-top:15px;
}

.row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px 5px;
  border-bottom:1px solid rgba(255,255,255,.12);
}

.name{
  flex:1;
  font-size:19px;
  font-weight:bold;
}

.song{
  display:block;
  font-size:14px;
  color:#ffd23f;
  margin-top:4px;
  font-weight:normal;
}

.score{
  min-width:100px;
  text-align:center;
}

.active{
  color:#52ff8a;
  font-weight:bold;
}

.current-song{
  display:block;
  color:#ffd23f;
  margin-top:8px;
  font-size:18px;
}

.status{
  text-align:center;
  font-size:20px;
  padding:15px;
  color:#ffd23f;
}

@media(max-width:650px){
  .form-grid{
    grid-template-columns:1fr;
  }

  .row{
    flex-wrap:wrap;
  }
}
</style>
</head>

<body>

<div class="app">

<h1>🎤 KARAOKE LIVE SHOW</h1>
<h2>PANNELLO ADMIN</h2>

<div class="card">

<h2>Concorrenti</h2>

<div class="form-grid">
  <input id="nameInput" placeholder="Nome concorrente">
  <input id="songInput" placeholder="Titolo canzone">
  <button class="add" onclick="addContestant()">AGGIUNGI</button>
</div>

<div id="contestants"></div>

</div>

<div class="card">

<h2>🎙️ CONCORRENTE IN GARA</h2>

<div class="status" id="currentStatus">
Nessun concorrente attivo
</div>

</div>

<div class="card">

<h2>🏆 CLASSIFICA LIVE</h2>

<div id="ranking">
Nessun concorrente.
</div>

<button class="reset" onclick="resetVotes()">
AZZERA TUTTI I VOTI
</button>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getDatabase,
  ref,
  push,
  set,
  remove,
  onValue,
  update,
  get
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

const firebaseConfig = {
  apiKey:"AIzaSyCHVOquom1j9D-0CzEzOlT3V3JpiHFIaII",
  authDomain:"karaoke-live-show-12421.firebaseapp.com",
  databaseURL:"https://karaoke-live-show-12421-default-rtdb.firebaseio.com",
  projectId:"karaoke-live-show-12421",
  storageBucket:"karaoke-live-show-12421.firebasestorage.app",
  messagingSenderId:"522751685586",
  appId:"1:522751685586:web:6b7e65ab23f05ca0fb4e0b"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.addContestant = async function(){

  const nameInput = document.getElementById("nameInput");
  const songInput = document.getElementById("songInput");

  const nome = nameInput.value.trim();
  const canzone = songInput.value.trim();

  if(!nome){
    alert("Scrivi il nome del concorrente");
    return;
  }

  if(!canzone){
    alert("Scrivi il titolo della canzone");
    return;
  }

  const newRef = push(ref(db,"concorrenti"));

  await set(newRef,{
    nome:nome,
    canzone:canzone,
    voti:0,
    totale:0
  });

  nameInput.value="";
  songInput.value="";
};

window.startContestant = async function(id,nome,canzone){

  await set(ref(db,"gara"),{
    currentId:id,
    currentName:nome,
    currentSong:canzone || "",
    votingOpen:true
  });
};

window.stopVoting = async function(){

  await update(ref(db,"gara"),{
    votingOpen:false
  });
};

window.deleteContestant = async function(id){

  if(!confirm("Eliminare questo concorrente?")) return;

  await remove(ref(db,"concorrenti/"+id));
};

window.resetVotes = async function(){

  if(!confirm("Vuoi azzerare tutti i voti?")) return;

  const snap = await get(ref(db,"concorrenti"));
  const data = snap.val() || {};

  const updates = {};

  Object.keys(data).forEach(id=>{
    updates["concorrenti/"+id+"/voti"]=0;
    updates["concorrenti/"+id+"/totale"]=0;
  });

  await update(ref(db),updates);
};

onValue(ref(db,"gara"),snap=>{

  const g = snap.val() || {};
  const box = document.getElementById("currentStatus");

  if(!g.currentId){
    box.innerHTML="Nessun concorrente attivo";
    return;
  }

  box.innerHTML =
    '<span class="active">'+escapeHtml(g.currentName || "")+'</span>'+
    '<span class="current-song">🎵 '+escapeHtml(g.currentSong || "")+'</span><br>'+
    (g.votingOpen
      ? '<button class="stop" onclick="stopVoting()">CHIUDI VOTAZIONE</button>'
      : '<button class="start" onclick=\'startContestant('+
        JSON.stringify(g.currentId)+','+
        JSON.stringify(g.currentName || "")+','+
        JSON.stringify(g.currentSong || "")+
        ')\'>RIAPRI VOTAZIONE</button>'
    );
});

onValue(ref(db,"concorrenti"),snap=>{

  const data = snap.val() || {};

  const list = document.getElementById("contestants");
  const ranking = document.getElementById("ranking");

  const arr = Object.entries(data).map(([id,c])=>{

    const voti = c.voti || 0;
    const totale = c.totale || 0;

    return {
      id:id,
      nome:c.nome || "Senza nome",
      canzone:c.canzone || "",
      voti:voti,
      totale:totale,
      media:voti ? totale/voti : 0
    };
  });

  if(!arr.length){

    list.innerHTML="<p>Nessun concorrente.</p>";
    ranking.innerHTML="Nessun concorrente.";
    return;
  }

  list.innerHTML = arr.map(c=>`

    <div class="row">

      <div class="name">
        🎤 ${escapeHtml(c.nome)}
        <span class="song">🎵 ${escapeHtml(c.canzone)}</span>
      </div>

      <button
        class="start"
        onclick='startContestant(
          ${JSON.stringify(c.id)},
          ${JSON.stringify(c.nome)},
          ${JSON.stringify(c.canzone)}
        )'>
        IN GARA
      </button>

      <button
        class="delete"
        onclick='deleteContestant(${JSON.stringify(c.id)})'>
        ELIMINA
      </button>

    </div>

  `).join("");

  const sorted = [...arr].sort((a,b)=>
    b.media-a.media || b.voti-a.voti
  );

  ranking.innerHTML = sorted.map((c,i)=>{

    const medal =
      i===0 ? "🥇" :
      i===1 ? "🥈" :
      i===2 ? "🥉" :
      (i+1)+"°";

    return `

      <div class="row">

        <div style="font-size:25px;width:45px">
          ${medal}
        </div>

        <div class="name">
          ${escapeHtml(c.nome)}
          <span class="song">🎵 ${escapeHtml(c.canzone)}</span>
        </div>

        <div class="score">
          ⭐ ${c.media.toFixed(1)}
          <br>
          <small>${c.voti} voti</small>
        </div>

      </div>

    `;
  }).join("");
});

function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

</script>

</body>
</html>
