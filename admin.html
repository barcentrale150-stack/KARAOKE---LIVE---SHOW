<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Karaoke Live Show</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(180deg,#07194d,#142a72,#09143d);
  color:white;
  min-height:100vh;
}

.app{
  max-width:850px;
  margin:auto;
  padding:25px 15px 60px;
}

h1{
  text-align:center;
  color:#ffd23f;
  font-size:38px;
  margin-bottom:5px;
}

h2{
  text-align:center;
}

.card{
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.15);
  border-radius:20px;
  padding:20px;
  margin-top:20px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:10px;
}

.event-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

input{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  font-size:17px;
}

button{
  border:0;
  border-radius:12px;
  padding:14px 18px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.add{
  background:#13d8e8;
  color:#073348;
}

.start{
  background:#35e779;
  color:#063b1c;
}

.stop{
  background:#ffbd28;
  color:#4c3100;
}

.delete{
  background:#ff315d;
  color:white;
}

.reset{
  background:#ff9f1c;
  color:#2c1900;
  width:100%;
  margin-top:15px;
}

.newgame{
  background:#d90429;
  color:white;
  width:100%;
  margin-top:12px;
  font-size:18px;
}

.event-add{
  background:#ffd23f;
  color:#3a2900;
  width:100%;
  margin-top:12px;
}

.row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px 5px;
  border-bottom:1px solid rgba(255,255,255,.12);
}

.name{
  flex:1;
  font-size:19px;
  font-weight:bold;
}

.song{
  display:block;
  font-size:14px;
  color:#ffd23f;
  margin-top:5px;
}

.score{
  min-width:110px;
  text-align:center;
}

.status{
  text-align:center;
  font-size:21px;
  padding:15px;
}

.active{
  color:#52ff8a;
  font-weight:bold;
  font-size:25px;
}

.current-song{
  display:block;
  color:#ffd23f;
  margin-top:8px;
  font-size:18px;
}

.event-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:15px;
  margin-top:12px;
  border-radius:15px;
  background:rgba(255,255,255,.07);
}

.event-date{
  min-width:95px;
  text-align:center;
  color:#ffd23f;
  font-weight:900;
}

.event-info{
  flex:1;
}

.event-place{
  font-size:18px;
  font-weight:bold;
}

.event-city{
  color:#ccc;
  margin-top:4px;
}

.note{
  text-align:center;
  color:#ddd;
  font-size:14px;
  margin-top:10px;
}

@media(max-width:650px){

  .form-grid,
  .event-grid{
    grid-template-columns:1fr;
  }

  .row,
  .event-row{
    flex-wrap:wrap;
  }
}
</style>
</head>

<body>

<div class="app">

<h1>🎤 KARAOKE LIVE SHOW</h1>
<h2>PANNELLO ADMIN</h2>


<div class="card">

<h2>🎤 CONCORRENTI</h2>

<div class="form-grid">

<input id="nameInput"
placeholder="Nome concorrente">

<input id="songInput"
placeholder="Titolo canzone">

<button class="add"
id="addButton">
AGGIUNGI
</button>

</div>

<div id="contestants"></div>

</div>


<div class="card">

<h2>🎙️ CONCORRENTE IN GARA</h2>

<div class="status"
id="currentStatus">

Nessun concorrente attivo

</div>

</div>


<div class="card">

<h2>🏆 CLASSIFICA LIVE</h2>

<div id="ranking">
Nessun concorrente.
</div>

<button class="reset"
id="resetButton">
AZZERA SOLO I VOTI
</button>

<button class="newgame"
id="newGameButton">
🗑️ NUOVA GARA - CANCELLA TUTTO
</button>

<div class="note">
Nuova gara cancella concorrenti, voti, classifica e concorrente attivo.
</div>

</div>


<div class="card">

<h2>📅 PROSSIMI EVENTI</h2>

<div class="event-grid">

<input
type="date"
id="eventDate">

<input
type="time"
id="eventTime">

<input
type="text"
id="eventPlace"
placeholder="Nome locale">

<input
type="text"
id="eventCity"
placeholder="Città">

</div>

<button
class="event-add"
id="addEventButton">

➕ AGGIUNGI EVENTO

</button>

<div id="eventsList"></div>

</div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getDatabase,
  ref,
  push,
  set,
  remove,
  onValue,
  update,
  get
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";


const firebaseConfig = {

  apiKey:
  "AIzaSyCHVOquom1j9D-0CzEzOlT3V3JpiHFIaII",

  authDomain:
  "karaoke-live-show-12421.firebaseapp.com",

  databaseURL:
  "https://karaoke-live-show-12421-default-rtdb.firebaseio.com",

  projectId:
  "karaoke-live-show-12421",

  storageBucket:
  "karaoke-live-show-12421.firebasestorage.app",

  messagingSenderId:
  "522751685586",

  appId:
  "1:522751685586:web:6b7e65ab23f05ca0fb4e0b"
};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


/* =========================
   CONCORRENTI
========================= */

const nameInput =
document.getElementById("nameInput");

const songInput =
document.getElementById("songInput");

const addButton =
document.getElementById("addButton");

const resetButton =
document.getElementById("resetButton");

const newGameButton =
document.getElementById("newGameButton");

const contestantsBox =
document.getElementById("contestants");

const rankingBox =
document.getElementById("ranking");

const currentStatus =
document.getElementById("currentStatus");


addButton.addEventListener(
"click",
async function(){

  const nome =
  nameInput.value.trim();

  const canzone =
  songInput.value.trim();


  if(!nome){

    alert("Scrivi il nome del concorrente");

    return;
  }


  if(!canzone){

    alert("Scrivi il titolo della canzone");

    return;
  }


  try{

    const newRef =
    push(ref(db,"concorrenti"));


    await set(newRef,{

      nome:nome,

      canzone:canzone,

      voti:0,

      totale:0

    });


    nameInput.value="";

    songInput.value="";


  }catch(error){

    console.error(error);

    alert("Errore durante l'aggiunta");

  }

});


async function startContestant(
id,
nome,
canzone
){

  try{

    await set(
      ref(db,"gara"),
      {

        currentId:id,

        currentName:nome,

        currentSong:canzone || "",

        votingOpen:true

      }
    );

  }catch(error){

    console.error(error);

    alert("Errore nell'apertura della votazione");

  }

}


async function stopVoting(){

  try{

    await update(
      ref(db,"gara"),
      {

        votingOpen:false

      }
    );

  }catch(error){

    console.error(error);

    alert("Errore nella chiusura della votazione");

  }

}


async function reopenVoting(){

  try{

    await update(
      ref(db,"gara"),
      {

        votingOpen:true

      }
    );

  }catch(error){

    console.error(error);

    alert("Errore nella riapertura della votazione");

  }

}


async function deleteContestant(id){

  const conferma =
  confirm(
    "Vuoi eliminare questo concorrente?"
  );


  if(!conferma) return;


  try{

    const garaSnap =
    await get(
      ref(db,"gara")
    );


    const gara =
    garaSnap.val();


    await remove(
      ref(
        db,
        "concorrenti/" + id
      )
    );


    if(
      gara &&
      gara.currentId === id
    ){

      await remove(
        ref(db,"gara")
      );

    }


  }catch(error){

    console.error(error);

    alert(
      "Errore durante l'eliminazione"
    );

  }

}


resetButton.addEventListener(
"click",
async function(){

  const conferma =
  confirm(
    "Vuoi azzerare tutti i voti lasciando i concorrenti?"
  );


  if(!conferma) return;


  try{

    const snap =
    await get(
      ref(db,"concorrenti")
    );


    const data =
    snap.val() || {};


    const updates = {};


    Object.keys(data)
    .forEach(id=>{

      updates[
      "concorrenti/"
      +id+
      "/voti"
      ]=0;


      updates[
      "concorrenti/"
      +id+
      "/totale"
      ]=0;

    });


    await update(
      ref(db),
      updates
    );


  }catch(error){

    console.error(error);

    alert(
      "Errore durante l'azzeramento"
    );

  }

});


newGameButton.addEventListener(
"click",
async function(){

  const conferma =
  confirm(
    "Vuoi iniziare una NUOVA GARA? Verranno cancellati concorrenti e voti."
  );


  if(!conferma) return;


  const conferma2 =
  confirm(
    "Confermi la cancellazione completa della gara?"
  );


  if(!conferma2) return;


  try{

    await remove(
      ref(db,"concorrenti")
    );


    await remove(
      ref(db,"gara")
    );


    alert(
      "Nuova gara pronta."
    );


  }catch(error){

    console.error(error);

    alert(
      "Errore durante il reset completo"
    );

  }

});


onValue(
ref(db,"gara"),
snapshot=>{

  const gara =
  snapshot.val() || {};


  currentStatus.innerHTML="";


  if(!gara.currentId){

    currentStatus.textContent =
    "Nessun concorrente attivo";

    return;

  }


  const nome =
  document.createElement("div");


  nome.className =
  "active";


  nome.textContent =
  gara.currentName || "";


  const canzone =
  document.createElement("span");


  canzone.className =
  "current-song";


  canzone.textContent =
  "🎵 " +
  (gara.currentSong || "");


  const br =
  document.createElement("br");


  const pulsante =
  document.createElement("button");


  if(gara.votingOpen){

    pulsante.className =
    "stop";


    pulsante.textContent =
    "CHIUDI VOTAZIONE";


    pulsante.addEventListener(
      "click",
      stopVoting
    );

  }else{

    pulsante.className =
    "start";


    pulsante.textContent =
    "RIAPRI VOTAZIONE";


    pulsante.addEventListener(
      "click",
      reopenVoting
    );

  }


  currentStatus.appendChild(nome);

  currentStatus.appendChild(canzone);

  currentStatus.appendChild(br);

  currentStatus.appendChild(pulsante);

});


onValue(
ref(db,"concorrenti"),
snapshot=>{

  const data =
  snapshot.val() || {};


  const concorrenti =
  Object.entries(data)
  .map(([id,c])=>{

    const voti =
    Number(c.voti || 0);


    const totale =
    Number(c.totale || 0);


    return{

      id:id,

      nome:
      c.nome || "Senza nome",

      canzone:
      c.canzone || "",

      voti:voti,

      totale:totale,

      media:
      voti > 0
      ? totale/voti
      : 0

    };

  });


  contestantsBox.innerHTML="";

  rankingBox.innerHTML="";


  if(
    concorrenti.length === 0
  ){

    contestantsBox.textContent =
    "Nessun concorrente.";


    rankingBox.textContent =
    "Nessun concorrente.";


    return;

  }


  concorrenti.forEach(c=>{

    const row =
    document.createElement("div");


    row.className =
    "row";


    const info =
    document.createElement("div");


    info.className =
    "name";


    info.textContent =
    "🎤 " + c.nome;


    const song =
    document.createElement("span");


    song.className =
    "song";


    song.textContent =
    "🎵 " + c.canzone;


    info.appendChild(song);


    const start =
    document.createElement("button");


    start.className =
    "start";


    start.textContent =
    "IN GARA";


    start.addEventListener(
      "click",
      ()=>startContestant(
        c.id,
        c.nome,
        c.canzone
      )
    );


    const del =
    document.createElement("button");


    del.className =
    "delete";


    del.textContent =
    "ELIMINA";


    del.addEventListener(
      "click",
      ()=>deleteContestant(c.id)
    );


    row.appendChild(info);

    row.appendChild(start);

    row.appendChild(del);


    contestantsBox.appendChild(row);

  });


  const sorted =
  [...concorrenti]
  .sort(
    (a,b)=>
    b.media-a.media ||
    b.voti-a.voti
  );


  sorted.forEach(
  (c,index)=>{

    const row =
    document.createElement("div");


    row.className =
    "row";


    const position =
    document.createElement("div");


    position.style.fontSize =
    "25px";


    position.style.width =
    "45px";


    if(index===0)
      position.textContent="🥇";

    else if(index===1)
      position.textContent="🥈";

    else if(index===2)
      position.textContent="🥉";

    else
      position.textContent=
      (index+1)+"°";


    const info =
    document.createElement("div");


    info.className =
    "name";


    info.textContent =
    c.nome;


    const song =
    document.createElement("span");


    song.className =
    "song";


    song.textContent =
    "🎵 " + c.canzone;


    info.appendChild(song);


    const score =
    document.createElement("div");


    score.className =
    "score";


    score.innerHTML =
    "⭐ " +
    c.media.toFixed(1) +
    "<br><small>" +
    c.voti +
    " voti</small>";


    row.appendChild(position);

    row.appendChild(info);

    row.appendChild(score);


    rankingBox.appendChild(row);

  });

});


/* =========================
   EVENTI
========================= */

const eventDate =
document.getElementById(
  "eventDate"
);


const eventTime =
document.getElementById(
  "eventTime"
);


const eventPlace =
document.getElementById(
  "eventPlace"
);


const eventCity =
document.getElementById(
  "eventCity"
);


const addEventButton =
document.getElementById(
  "addEventButton"
);


const eventsList =
document.getElementById(
  "eventsList"
);


addEventButton.addEventListener(
"click",
async function(){

  const data =
  eventDate.value;


  const ora =
  eventTime.value;


  const locale =
  eventPlace.value.trim();


  const citta =
  eventCity.value.trim();


  if(!data){

    alert(
      "Inserisci la data"
    );

    return;

  }


  if(!ora){

    alert(
      "Inserisci l'orario"
    );

    return;

  }


  if(!locale){

    alert(
      "Inserisci il nome del locale"
    );

    return;

  }


  if(!citta){

    alert(
      "Inserisci la città"
    );

    return;

  }


  try{

    const newEvent =
    push(
      ref(db,"eventi")
    );


    await set(
      newEvent,
      {

        data:data,

        ora:ora,

        locale:locale,

        citta:citta,

        createdAt:
        Date.now()

      }
    );


    eventDate.value="";

    eventTime.value="";

    eventPlace.value="";

    eventCity.value="";


    alert(
      "Evento aggiunto!"
    );


  }catch(error){

    console.error(error);


    alert(
      "Errore durante l'aggiunta dell'evento"
    );

  }

});


async function deleteEvent(id){

  const conferma =
  confirm(
    "Vuoi eliminare questo evento?"
  );


  if(!conferma) return;


  try{

    await remove(
      ref(
        db,
        "eventi/" + id
      )
    );


  }catch(error){

    console.error(error);


    alert(
      "Errore durante l'eliminazione dell'evento"
    );

  }

}


onValue(
ref(db,"eventi"),
snapshot=>{

  const data =
  snapshot.val() || {};


  const eventi =
  Object.entries(data)
  .map(([id,e])=>{

    return{

      id:id,

      data:
      e.data || "",

      ora:
      e.ora || "",

      locale:
      e.locale || "",

      citta:
      e.citta || ""

    };

  });


  eventi.sort(
    (a,b)=>
    (
      a.data +
      " " +
      a.ora
    )
    .localeCompare(
      b.data +
      " " +
      b.ora
    )
  );


  eventsList.innerHTML="";


  if(
    eventi.length === 0
  ){

    eventsList.innerHTML =
    '<div class="note">Nessun evento inserito.</div>';

    return;

  }


  eventi.forEach(e=>{

    const row =
    document.createElement("div");


    row.className =
    "event-row";


    const date =
    document.createElement("div");


    date.className =
    "event-date";


    date.innerHTML =
    formatDate(e.data) +
    "<br>🕒 " +
    e.ora;


    const info =
    document.createElement("div");


    info.className =
    "event-info";


    const place =
    document.createElement("div");


    place.className =
    "event-place";


    place.textContent =
    "🎤 " + e.locale;


    const city =
    document.createElement("div");


    city.className =
    "event-city";


    city.textContent =
    "📍 " + e.citta;


    info.appendChild(place);

    info.appendChild(city);


    const del =
    document.createElement("button");


    del.className =
    "delete";


    del.textContent =
    "ELIMINA";


    del.addEventListener(
      "click",
      ()=>deleteEvent(e.id)
    );


    row.appendChild(date);

    row.appendChild(info);

    row.appendChild(del);


    eventsList.appendChild(row);

  });

});


function formatDate(dateString){

  if(!dateString)
    return "";


  const parts =
  dateString.split("-");


  if(parts.length !== 3)
    return dateString;


  return (
    parts[2] +
    "/" +
    parts[1] +
    "/" +
    parts[0]
  );

}

</script>

</body>
</html>
