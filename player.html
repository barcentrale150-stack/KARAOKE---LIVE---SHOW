<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Player - Karaoke Live Show</title>

<script src="https://cdn.jsdelivr.net/npm/tone@15.1.22/build/Tone.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:white;
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 10%,rgba(255,0,180,.20),transparent 30%),
    radial-gradient(circle at 85% 15%,rgba(0,180,255,.18),transparent 30%),
    linear-gradient(180deg,#07112d,#10184d,#080d29);
}

.app{
  width:min(1250px,96%);
  margin:auto;
  padding:24px 14px 50px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:22px;
  flex-wrap:wrap;
}

.brand{
  color:#ffd21f;
  font-size:32px;
  font-weight:900;
}

.back{
  display:inline-block;
  padding:12px 18px;
  border-radius:12px;
  background:rgba(255,255,255,.10);
  color:white;
  text-decoration:none;
  font-weight:bold;
  margin-left:6px;
}

.grid{
  display:grid;
  grid-template-columns:360px 1fr;
  gap:22px;
}

.card{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  border-radius:22px;
  padding:20px;
}

.library-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.library-title h2{margin:0}

.file-label{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:12px 16px;
  border-radius:12px;
  cursor:pointer;
  background:#18d7e7;
  color:#04323b;
  font-weight:900;
}

#fileInput{display:none}

.search{
  width:100%;
  margin-top:16px;
  padding:14px;
  border:0;
  border-radius:12px;
  font-size:17px;
}

.library{
  margin-top:14px;
  max-height:650px;
  overflow:auto;
}

.song-item{
  padding:13px;
  margin:8px 0;
  border-radius:12px;
  background:rgba(255,255,255,.06);
  cursor:pointer;
  border:1px solid transparent;
}

.song-item:hover{
  background:rgba(255,255,255,.10);
}

.song-item.active{
  border-color:#ffd21f;
  background:rgba(255,210,31,.10);
}

.song-name{font-weight:900}

.song-extra{
  color:#bfc2d4;
  font-size:13px;
  margin-top:4px;
}

.player{
  min-height:690px;
}

.now{text-align:center}

.now-label{
  color:#adb0c6;
  font-size:13px;
  font-weight:bold;
}

.now-title{
  margin-top:7px;
  color:#ffd21f;
  font-size:32px;
  font-weight:900;
}

.time{
  display:flex;
  justify-content:space-between;
  margin-top:24px;
  color:#cfd1df;
}

#seek{width:100%}

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  margin-top:20px;
  flex-wrap:wrap;
}

button{
  border:0;
  border-radius:14px;
  padding:14px 18px;
  font-weight:900;
  font-size:16px;
  cursor:pointer;
}

.control{
  background:rgba(255,255,255,.10);
  color:white;
}

.play{
  background:#52ff8a;
  color:#052d14;
  font-size:22px;
  min-width:110px;
}

.stop{
  background:#ff315d;
  color:white;
}

.display{
  background:#ffd21f;
  color:#2b2200;
}

.full{
  background:#7c4dff;
  color:white;
}

.options{
  margin-top:24px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.option{
  background:rgba(255,255,255,.05);
  border-radius:14px;
  padding:14px;
}

.option label{
  display:block;
  color:#ffd21f;
  font-weight:bold;
  margin-bottom:8px;
}

.option input{
  width:100%;
}

.value{
  text-align:center;
  margin-top:6px;
  font-weight:bold;
}

.pitch-box{
  margin-top:18px;
  background:rgba(255,255,255,.05);
  border-radius:16px;
  padding:18px;
  text-align:center;
}

.pitch-title{
  color:#ffd21f;
  font-size:18px;
  font-weight:900;
  margin-bottom:14px;
}

.pitch-controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

.pitch-minus,
.pitch-plus{
  min-width:95px;
  font-size:23px;
}

.pitch-minus{
  background:#1a77ff;
  color:white;
}

.pitch-plus{
  background:#ff259d;
  color:white;
}

.pitch-reset{
  background:#ffd21f;
  color:#251e00;
}

.pitch-value{
  min-width:100px;
  font-size:30px;
  font-weight:900;
}

.lyrics{
  margin-top:24px;
  min-height:260px;
  border-radius:20px;
  background:#03040a;
  border:1px solid rgba(255,255,255,.10);
  padding:24px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  text-align:center;
  overflow:hidden;
}

.previous-line,
.next-line{
  color:#74778a;
  font-size:21px;
  min-height:30px;
}

.current-line{
  color:#ffd21f;
  font-size:42px;
  font-weight:900;
  margin:20px 0;
  text-shadow:0 0 14px rgba(255,210,31,.25);
}

.no-lyrics{
  color:#9ca0b4;
  font-size:18px;
}

.info-bar{
  margin-top:15px;
  color:#bfc2d4;
  text-align:center;
  font-size:13px;
}

.format-status{
  margin-top:10px;
  text-align:center;
  color:#ffd21f;
  font-size:13px;
}

@media(max-width:850px){
  .grid{grid-template-columns:1fr}
  .library{max-height:280px}
  .options{grid-template-columns:1fr}

<body>

<div class="app">

<div class="topbar">

  <div class="brand">
    🎤 KARAOKE LIVE SHOW — PLAYER
  </div>

  <div>
    <a class="back" href="admin.html">← ADMIN</a>
    <a class="back" href="sito.html">🌐 SITO</a>
  </div>

</div>

<div class="grid">

<!-- LIBRERIA -->

<div class="card">

  <div class="library-title">

    <h2>🎵 Libreria</h2>

    <label class="file-label">
      + CARICA
      <input
      id="fileInput"
      type="file"
      multiple
      accept=".mp3,.lrc,.txt,audio/mpeg">
    </label>

  </div>

  <input
  id="search"
  class="search"
  placeholder="Cerca canzone...">

  <div id="library" class="library">
    <div class="song-extra">
      Carica uno o più MP3.
    </div>
  </div>

</div>


<!-- PLAYER -->

<div class="card player">

  <div class="now">

    <div class="now-label">
      BRANO IN RIPRODUZIONE
    </div>

    <div
    class="now-title"
    id="nowTitle">
      Nessun brano
    </div>

  </div>

  <audio id="audio"></audio>

  <div class="time">

    <span id="currentTime">00:00</span>
    <span id="duration">00:00</span>

  </div>

  <input
  id="seek"
  type="range"
  min="0"
  max="100"
  value="0">

  <div class="controls">

    <button
    class="control"
    id="back10">
      ⏪ 10s
    </button>

    <button
    class="play"
    id="playButton">
      ▶ PLAY
    </button>

    <button
    class="control"
    id="forward10">
      10s ⏩
    </button>

    <button
    class="stop"
    id="stopButton">
      ■ STOP
    </button>

    <button
    class="display"
    id="displayButton">
      🖥 DISPLAY 2
    </button>

    <button
    class="full"
    id="fullscreenButton">
      ⛶ SCHERMO INTERO
    </button>

  </div>


  <!-- TONALITÀ -->

  <div class="pitch-box">

    <div class="pitch-title">
      🎼 TONALITÀ
    </div>

    <div class="pitch-controls">

      <button
      class="pitch-minus"
      id="pitchMinus">
        −
      </button>

      <div
      class="pitch-value"
      id="pitchValue">
        0
      </div>

      <button
      class="pitch-plus"
      id="pitchPlus">
        +
      </button>

      <button
      class="pitch-reset"
      id="pitchReset">
        RESET 0
      </button>

    </div>

    <div
    style="margin-top:8px;color:#bbb;font-size:13px">

      Da −6 a +6 semitoni

    </div>

  </div>


  <!-- VOLUME E VELOCITÀ -->

  <div class="options">

    <div class="option">

      <label>
        🔊 Volume
      </label>

      <input
      id="volume"
      type="range"
      min="0"
      max="1"
      step="0.01"
      value="1">

      <div
      class="value"
      id="volumeValue">
        100%
      </div>

    </div>


    <div class="option">

      <label>
        ⚡ Velocità

      <input
      id="speed"
      type="range"
      min="0.70"
      max="1.30"
      step="0.05"
      value="1">

      <div
      class="value"
      id="speedValue">
        1.00x
      </div>

    </div>

  </div>


  <!-- TESTO -->

        Carica un MP3.

    class="next-line"

    </div>

  </div>

  <div
  class="format-status"
  id="formatStatus">
    In attesa di un brano...
  </div>

  <div class="info-bar">
    Supporto MP3 + LRC e tentativo automatico
    di lettura testo sincronizzato ID3 SYLT.
  </div>

</div>

</div>

</div>


<script>

const audio =
document.getElementById("audio");

audio.preservesPitch = true;

const fileInput =
document.getElementById("fileInput");

const library =
document.getElementById("library");

const search =
document.getElementById("search");

const nowTitle =
document.getElementById("nowTitle");

const playButton =
document.getElementById("playButton");

const stopButton =
document.getElementById("stopButton");

const back10 =
document.getElementById("back10");

const forward10 =
document.getElementById("forward10");

const seek =
document.getElementById("seek");

const currentTimeBox =
document.getElementById("currentTime");

const durationBox =
document.getElementById("duration");

const volume =
document.getElementById("volume");

const volumeValue =
document.getElementById("volumeValue");

const speed =
document.getElementById("speed");

const speedValue =
document.getElementById("speedValue");

const displayButton =
document.getElementById("displayButton");

const fullscreenButton =
document.getElementById("fullscreenButton");

const previousLine =
document.getElementById("previousLine");

const currentLine =
document.getElementById("currentLine");

const nextLine =
document.getElementById("nextLine");

const formatStatus =
document.getElementById("formatStatus");

const pitchMinus =
document.getElementById("pitchMinus");

const pitchPlus =
document.getElementById("pitchPlus");

const pitchReset =
document.getElementById("pitchReset");

const pitchValue =
document.getElementById("pitchValue");


let songs = [];

let currentSong = null;

let currentLyrics = [];

let displayWindow = null;

let pitchSemitones = 0;


/* AUDIO TONALITÀ */

let audioGraphReady = false;
let mediaSource = null;
let pitchShift = null;
let masterGain = null;


async function initAudioGraph(){

  if(audioGraphReady){
    await Tone.start();
    return;
  }

  await Tone.start();

  const ctx =
  Tone.getContext().rawContext;

  mediaSource =
  ctx.createMediaElementSource(audio);

  pitchShift =
  new Tone.PitchShift({
    pitch:0,
    windowSize:0.1,
    delayTime:0,
    feedback:0
  });

  masterGain =
  new Tone.Gain(1);

  mediaSource.connect(
    pitchShift.input
  );

  pitchShift.connect(
    masterGain
  );

  masterGain.toDestination();

  audioGraphReady = true;

}


function setPitch(value){

  pitchSemitones =
  Math.max(
    -6,
    Math.min(6,value)
  );

  pitchValue.textContent =
  pitchSemitones > 0
  ? "+" + pitchSemitones
  : String(pitchSemitones);

  if(pitchShift){

    pitchShift.pitch =
    pitchSemitones;

  }

}


pitchMinus.addEventListener(
"click",
async ()=>{

  await initAudioGraph();

  setPitch(
    pitchSemitones - 1
  );

});


pitchPlus.addEventListener(
"click",
async ()=>{

  await initAudioGraph();

  setPitch(
    pitchSemitones + 1
  );

});


pitchReset.addEventListener(
"click",
async ()=>{

  await initAudioGraph();

  setPitch(0);

});


/* NOMI FILE */

function cleanName(name){

  return name
  .replace(/\.[^/.]+$/,"")
  .trim();

}


function baseName(name){

  return cleanName(name)
  .toLowerCase()
  .replace(/\s+/g," ")
  .trim();

}


/* CARICAMENTO */

fileInput.addEventListener(
"change",
async function(){

  const files =
  Array.from(fileInput.files);

  const mp3Files =
  files.filter(
    f =>
    f.name
    .toLowerCase()
    .endsWith(".mp3")
  );

  const lyricFiles =
  files.filter(
    f =>
    f.name
    .toLowerCase()
    .endsWith(".lrc")
    ||
    f.name
    .toLowerCase()
    .endsWith(".txt")
  );


  for(const mp3 of mp3Files){

    const existing =
    songs.find(
      s => s.file.name === mp3.name
    );

    if(existing){
      continue;
    }

    const lyric =
    lyricFiles.find(
      l =>
      baseName(l.name) ===
      baseName(mp3.name)
    );

    songs.push({

      id:
      Date.now()
      +
      Math.random(),

      file:mp3,

      url:
      URL.createObjectURL(mp3),

      title:
      cleanName(mp3.name),

      lyricFile:
      lyric || null

    });

  }

  renderLibrary();

});


/* LIBRERIA */

function renderLibrary(){

  const query =
  search.value
  .toLowerCase()
  .trim();

  library.innerHTML="";

  const filtered =
  songs.filter(
    song =>
    song.title
    .toLowerCase()
    .includes(query)
  );

  if(filtered.length===0){

    library.innerHTML=
    '<div class="song-extra">Nessun brano.</div>';

    return;
  }

  filtered.forEach(song=>{

    const item =
    document.createElement("div");

    item.className=
    "song-item";

    if(
      currentSong &&
      currentSong.id === song.id
    ){

      item.classList.add("active");

    }

    const name =
    document.createElement("div");

    name.className=
    "song-name";

    name.textContent=
    "🎵 " + song.title;

    const extra =
    document.createElement("div");

    extra.className=
    "song-extra";

    extra.textContent=
    song.lyricFile
    ?
    "LRC/TXT disponibile"
    :
    "MP3 — ricerca SYLT automatica";

    item.appendChild(name);
    item.appendChild(extra);

    item.addEventListener(
      "click",
      ()=>loadSong(song)
    );

    library.appendChild(item);

  });

}


search.addEventListener(
"input",
renderLibrary
);


/* CARICA BRANO */

async function loadSong(song){

  currentSong =
  song;

  audio.pause();

  audio.src =
  song.url;

  nowTitle.textContent =
  song.title;

  currentLyrics = [];

  setPitch(0);

  previousLine.textContent="";
  nextLine.textContent="";

  currentLine.innerHTML=
  '<span class="no-lyrics">Ricerca testo sincronizzato...</span>';

  formatStatus.textContent=
  "Analisi MP3...";


  if(song.lyricFile){

    const text =
    await song.lyricFile.text();

    currentLyrics =
    parseLRC(text);

    if(currentLyrics.length){

      formatStatus.textContent=
      "✓ Testo LRC sincronizzato trovato";

    }

  }


  if(currentLyrics.length===0){

    try{

      const buffer =
      await song.file.arrayBuffer();

      const sylt =
      parseID3SYLT(buffer);

      if(sylt.length){

        currentLyrics =
        sylt;

        formatStatus.textContent=
        "✓ Testo SYLT sincronizzato trovato dentro l'MP3";

      }else{

        formatStatus.textContent=
        "Nessun frame SYLT standard trovato";

      }

    }catch(error){

      console.error(error);

      formatStatus.textContent=
      "Errore durante l'analisi del testo";

    }

  }


  if(currentLyrics.length===0){

    currentLine.innerHTML=
    '<span class="no-lyrics">Il testo sincronizzato di questo MP3 non è ancora stato riconosciuto.</span>';

  }


  seek.value=0;

  renderLibrary();

  updateDisplay();

}


/* LRC */

function parseLRC(text){

  const result = [];

  const lines =
  text.split(/\r?\n/);

  lines.forEach(line=>{

    const matches =
    [...line.matchAll(
      /\[(\d{1,2}):(\d{2})(?:[.:](\d{1,3}))?\]/g
    )];

    if(matches.length===0){
      return;
    }

    const lyricText =
    line.replace(
      /\[[^\]]+\]/g,
      ""
    ).trim();

    matches.forEach(match=>{

      const minutes =
      Number(match[1]);

      const seconds =
      Number(match[2]);

      let fraction =
      match[3] || "0";

      if(fraction.length===1){

        fraction =
        Number(fraction)/10;

      }else if(fraction.length===2){

        fraction =
        Number(fraction)/100;

      }else{

        fraction =
        Number(fraction)/1000;

      }

      const time =
      minutes*60
      +
      seconds
      +
      Number(fraction);

      result.push({
        time:time,
        text:lyricText
      });

    });

  });

  result.sort(
    (a,b)=>a.time-b.time
  );

  return result;

}


/* ID3 / SYLT */

function synchsafe32(
a,b,c,d
){

  return (
    (a << 21) |
    (b << 14) |
    (c << 7) |
    d
  );

}


function uint32be(
bytes,
offset
){

  return (
    (
      bytes[offset] * 0x1000000
    )
    +
    (
      bytes[offset+1] << 16
    )
    +
    (
      bytes[offset+2] << 8
    )
    +
    bytes[offset+3]
  ) >>> 0;

}


function parseID3SYLT(arrayBuffer){

  const bytes =
  new Uint8Array(arrayBuffer);

  if(
    bytes.length < 10 ||
    bytes[0] !== 0x49 ||
    bytes[1] !== 0x44 ||
    bytes[2] !== 0x33
  ){

    return [];

  }

  const version =
  bytes[3];

  const tagSize =
  synchsafe32(
    bytes[6],
    bytes[7],
    bytes[8],
    bytes[9]
  );

  let offset = 10;

  const end =
  Math.min(
    bytes.length,
    10 + tagSize
  );


  while(
    offset + 10 <= end
  ){

    const frameId =
    String.fromCharCode(
      bytes[offset],
      bytes[offset+1],
      bytes[offset+2],
      bytes[offset+3]
    );

    if(
      !frameId.trim() ||
      bytes[offset] === 0
    ){

      break;

    }

    let frameSize;

    if(version === 4){

      frameSize =
      synchsafe32(
        bytes[offset+4],
        bytes[offset+5],
        bytes[offset+6],
        bytes[offset+7]
      );

    }else{

      frameSize =
      uint32be(
        bytes,
        offset+4
      );

    }

    if(
      frameSize <= 0 ||
      offset + 10 + frameSize > bytes.length
    ){

      break;

    }

    if(frameId === "SYLT"){

      const frameData =
      bytes.slice(
        offset+10,
        offset+10+frameSize
      );

      const lyrics =
      parseSYLTFrame(
        frameData
      );

      if(lyrics.length){

        return lyrics;

      }

    }

    offset +=
    10 + frameSize;

  }

  return [];

}


function parseSYLTFrame(data){

  if(data.length < 7){

    return [];

  }

  const encoding =
  data[0];

  const timestampFormat =
  data[4];

  /*
  SYLT:
  1 = millisecondi
  2 = frame MPEG
  */

  if(timestampFormat !== 1){

    return [];

  }

  let pos = 6;

  const descriptor =
  readEncodedString(
    data,
    pos,
    encoding
  );

  pos =
  descriptor.next;

  const result = [];


  while(
    pos < data.length
  ){

    const lyric =
    readEncodedString(
      data,
      pos,
      encoding
    );

    pos =
    lyric.next;

    if(pos + 4 > data.length){

      break;

    }

    const ms =
    uint32be(
      data,
      pos
    );

    pos += 4;

    const text =
    lyric.text.trim();

    if(text){

      result.push({
        time:ms/1000,
        text:text
      });

    }

  }

  result.sort(
    (a,b)=>a.time-b.time
  );

  return result;

}


function readEncodedString(
data,
start,
encoding
){

  if(start >= data.length){

    return {
      text:"",
      next:data.length
    };

  }


  if(
    encoding === 1 ||
    encoding === 2
  ){

    let end = start;

    while(
      end + 1 < data.length
    ){

      if(
        data[end] === 0 &&
        data[end+1] === 0
      ){

        break;

      }

      end += 2;

    }

    const slice =
    data.slice(
      start,
      end
    );

    let text =
    decodeText(
      slice,
      encoding
    );

    return {
      text:text,
      next:
      Math.min(
        data.length,
        end + 2
      )
    };

  }


  let end = start;

  while(
    end < data.length &&
    data[end] !== 0
  ){

    end++;

  }

  const slice =
  data.slice(
    start,
    end
  );

  return {
    text:
    decodeText(
      slice,
      encoding
    ),
    next:
    Math.min(
      data.length,
      end+1
    )
  };

}


function decodeText(
bytes,
encoding
){

  try{

    if(encoding === 3){

      return new TextDecoder(
        "utf-8"
      ).decode(bytes);

    }

    if(encoding === 2){

      return new TextDecoder(
        "utf-16be"
      ).decode(bytes);

    }

    if(encoding === 1){

      /*
      UTF-16 con BOM
      */

      if(
        bytes.length >= 2 &&
        bytes[0] === 0xFE &&
        bytes[1] === 0xFF
      ){

        return new TextDecoder(
          "utf-16be"
        ).decode(
          bytes.slice(2)
        );

      }

      return new TextDecoder(
        "utf-16le"
      ).decode(
        (
          bytes.length >= 2 &&
          bytes[0] === 0xFF &&
          bytes[1] === 0xFE
        )
        ?
        bytes.slice(2)
        :
        bytes
      );

    }

    return new TextDecoder(
      "windows-1252"
    ).decode(bytes);

  }catch(error){

    console.error(error);

    return "";

  }

}

playButton.addEventListener(
"click",
async ()=>{

  if(!currentSong){

    alert(
      "Seleziona prima un brano."
    );

    return;
  }

  await initAudioGraph();

  if(audio.paused){

    await audio.play();

  }else{

    audio.pause();

  }

});


audio.addEventListener(
"play",
()=>{

  playButton.textContent=
  "⏸ PAUSA";

});


audio.addEventListener(
"pause",
()=>{

  playButton.textContent=
  "▶ PLAY";

});


stopButton.addEventListener(
"click",
()=>{

  audio.pause();

  audio.currentTime=0;

});


back10.addEventListener(
"click",
()=>{

  audio.currentTime =
  Math.max(
    0,
    audio.currentTime-10
  );

});


forward10.addEventListener(
"click",
()=>{

  audio.currentTime =
  Math.min(
    audio.duration || 0,
    audio.currentTime+10
  );

});


volume.addEventListener(
"input",
()=>{

  const v =
  Number(volume.value);

  audio.volume = 1;

  if(masterGain){

    masterGain.gain.value =
    v;

  }

  volumeValue.textContent =
  Math.round(v*100)
  + "%";

});


speed.addEventListener(
"input",
()=>{

  audio.playbackRate =
  Number(speed.value);

  audio.preservesPitch =
  true;

  speedValue.textContent =
  audio.playbackRate
  .toFixed(2)
  + "x";

});


seek.addEventListener(
"input",
()=>{

  if(!audio.duration){
    return;
  }

  audio.currentTime =
  (
    Number(seek.value)
    /
    100
  )
  *
  audio.duration;

});


audio.addEventListener(
"timeupdate",
()=>{

  if(audio.duration){

    seek.value =
    (
      audio.currentTime
      /
      audio.duration
    )
    *
    100;

  }

  currentTimeBox.textContent =
  formatTime(
    audio.currentTime
  );

  durationBox.textContent =
  formatTime(
    audio.duration
  );

  updateLyrics();

});


audio.addEventListener(
"loadedmetadata",
()=>{

  durationBox.textContent =
  formatTime(
    audio.duration
  );

});


function formatTime(seconds){

  if(
    !Number.isFinite(seconds)
  ){

    return "00:00";

  }

  const m =
  Math.floor(seconds/60);

  const s =
  Math.floor(seconds%60);

  return (
    String(m).padStart(2,"0")
    +
    ":"
    +
    String(s).padStart(2,"0")
  );

}


/* TESTO SINCRONIZZATO */

function updateLyrics(){

  if(currentLyrics.length===0){

    updateDisplay();

    return;

  }

  let index = -1;

  for(
    let i=0;
    i<currentLyrics.length;
    i++
  ){

    if(
      audio.currentTime >=
      currentLyrics[i].time
    ){

      index=i;

    }else{

      break;

    }

  }


  if(index<0){

    previousLine.textContent="";

    currentLine.textContent="";

    nextLine.textContent=
    currentLyrics[0]?.text || "";

  }else{

    previousLine.textContent=
    currentLyrics[index-1]?.text
    || "";

    currentLine.textContent=
    currentLyrics[index]?.text
    || "";

    nextLine.textContent=
    currentLyrics[index+1]?.text
    || "";

  }

  updateDisplay();

}

function updateDisplay(){

  if(
    !displayWindow ||
    displayWindow.closed
  ){

    return;

  }

  const p =
  displayWindow.document
  .getElementById(
    "displayPrevious"
  );

  const c =
  displayWindow.document
  .getElementById(
    "displayCurrent"
  );

  const n =
  displayWindow.document
  .getElementById(
    "displayNext"
  );

  const t =
  displayWindow.document
  .getElementById(
    "displayTitle"
  );

  const pitch =
  displayWindow.document
  .getElementById(
    "displayPitch"
  );


  if(t){

    t.textContent =
    currentSong
    ?
    currentSong.title
    :
    "KARAOKE LIVE SHOW";

  }

  if(pitch){

    pitch.textContent =
    "TONALITÀ "
    +
    (
      pitchSemitones > 0
      ?
      "+"
      +
      pitchSemitones
      :
      pitchSemitones
    );

  }

  if(p){

    p.textContent =
    previousLine.textContent;

  }

  if(c){

    c.textContent =
    currentLine.textContent
    ||
    "IN ATTESA";

  }

  if(n){

    n.textContent =
    nextLine.textContent;

  }

}
