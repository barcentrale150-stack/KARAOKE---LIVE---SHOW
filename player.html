<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player - Karaoke Live Show</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:white;
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 10%,rgba(255,0,180,.20),transparent 30%),
    radial-gradient(circle at 85% 15%,rgba(0,180,255,.18),transparent 30%),
    linear-gradient(180deg,#07112d,#10184d,#080d29);
}

.app{
  width:min(1250px,96%);
  margin:auto;
  padding:24px 14px 50px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;

  flex-wrap:wrap;
}

.brand{
  color:#ffd21f;

  font-weight:900;
}

.back{
  display:inline-block;
  padding:12px 18px;
  border-radius:12px;
  background:rgba(255,255,255,.10);
  color:white;
  text-decoration:none;
  font-weight:bold;
  margin-left:6px;
}

.grid{
  display:grid;
  grid-template-columns:360px 1fr;
  gap:22px;
}

.card{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);

}

}

#fileInput{display:none}

  font-size:18px;
}

.format-status{

  text-align:center;

  font-size:14px;

<body>

<div class="app">

<div class="topbar">

  <div class="brand">
    🎤 KARAOKE LIVE SHOW — PLAYER
  </div>

  <div>
    <a class="back" href="admin.html">← ADMIN</a>
    <a class="back" href="sito.html">🌐 SITO</a>
  </div>

</div>

<div class="grid">

<div class="card">

  <div class="library-title">

    <h2>🎵 Libreria</h2>

    <label class="file-label">
      + CARICA
      <input
      id="fileInput"
      type="file"
      multiple
      accept=".mp3,.lrc,.txt,audio/mpeg">
    </label>

  id="search"
  class="search"
  placeholder="Cerca canzone...">

  <div id="library" class="library">
    <div class="song-extra">
      Carica uno o più MP3.
    </div>
  </div>

</div>


<div class="card player">

  <div class="now">

    <div class="now-label">
      BRANO IN RIPRODUZIONE
    </div>

    <div
    class="now-title"
    id="nowTitle">
      Nessun brano
    </div>

  </div>

  <audio id="audio" preload="metadata"></audio>

  <div class="time">
    <span id="currentTime">00:00</span>
    <span id="duration">00:00</span>
  </div>

  id="seek"
  type="range"
  min="0"
  max="100"
  step="0.1"
  value="0">

    <button class="control" id="back10">
      ⏪ 10s
    </button>

    </button>

      10s ⏩
    </button>

    </button>

    </button>

    </button>

    </div>

  </div>


  <div
  class="format-status"
  id="formatStatus">
    In attesa di un brano...
  </div>

  <div class="info-bar">
    Testo M-Live ricostruito in righe con evidenziazione sincronizzata.
  </div>

</div>

</div>

</div>


<script>

const audio = document.getElementById("audio");
const fileInput = document.getElementById("fileInput");
const library = document.getElementById("library");
const search = document.getElementById("search");
const nowTitle = document.getElementById("nowTitle");
const playButton = document.getElementById("playButton");
const stopButton = document.getElementById("stopButton");
const back10 = document.getElementById("back10");
const forward10 = document.getElementById("forward10");
const seek = document.getElementById("seek");
const currentTimeBox = document.getElementById("currentTime");
const durationBox = document.getElementById("duration");
const volume = document.getElementById("volume");
const volumeValue = document.getElementById("volumeValue");
const speed = document.getElementById("speed");
const speedValue = document.getElementById("speedValue");
const displayButton = document.getElementById("displayButton");
const fullscreenButton = document.getElementById("fullscreenButton");
const previousLine = document.getElementById("previousLine");
const currentLine = document.getElementById("currentLine");
const nextLine = document.getElementById("nextLine");
const formatStatus = document.getElementById("formatStatus");

let songs = [];
let currentSong = null;

/*
Ogni elemento sarà una RIGA completa:

{
 start: 3.41,
 chunks: [
   {time:3.41,text:"DI"},
   {time:3.59,text:"CE"},
   ...
 ],
 text:"DICE CHE ERA UN BELL'UOMO E VENIVA"
}
*/

let lyricLines = [];
let displayWindow = null;


/* FILE */

function cleanName(name){
  return name.replace(/\.[^/.]+$/,"").trim();
}

function baseName(name){
  return cleanName(name)
  .toLowerCase()
  .replace(/\s+/g," ")
  .trim();
}


fileInput.addEventListener("change",function(){

  const files = Array.from(fileInput.files);

  const mp3Files = files.filter(
    f => f.name.toLowerCase().endsWith(".mp3")
  );

  const lyricFiles = files.filter(
    f =>
    f.name.toLowerCase().endsWith(".lrc") ||
    f.name.toLowerCase().endsWith(".txt")
  );

  mp3Files.forEach(mp3=>{

    const existing = songs.find(
      s => s.file.name === mp3.name
    );

    if(existing){
      return;
    }

    const lyric = lyricFiles.find(
      l => baseName(l.name) === baseName(mp3.name)
    );

    songs.push({
      id:Date.now()+Math.random(),
      file:mp3,
      url:URL.createObjectURL(mp3),
      title:cleanName(mp3.name),
      lyricFile:lyric || null
    });

  });

  renderLibrary();

});


/* LIBRERIA */

function renderLibrary(){

  const query =
  search.value.toLowerCase().trim();

  library.innerHTML="";

  const filtered = songs.filter(
    song =>
    song.title.toLowerCase().includes(query)
  );

  if(filtered.length===0){

    library.innerHTML=
    '<div class="song-extra">Nessun brano.</div>';

    return;
  }

  filtered.forEach(song=>{

    const item =
    document.createElement("div");

    item.className="song-item";

    if(
      currentSong &&
      currentSong.id === song.id
    ){
      item.classList.add("active");
    }

    const name =
    document.createElement("div");

    name.className="song-name";
    name.textContent="🎵 "+song.title;

    const extra =
    document.createElement("div");

    extra.className="song-extra";

    extra.textContent=
    "MP3 — lettura karaoke M-Live";

    item.appendChild(name);
    item.appendChild(extra);

    item.addEventListener(
      "click",
      ()=>loadSong(song)
    );

    library.appendChild(item);

  });

}

search.addEventListener("input",renderLibrary);


/* CARICA BRANO */

async function loadSong(song){

  audio.pause();

  currentSong = song;
  lyricLines = [];

  audio.src = song.url;
  audio.load();

  nowTitle.textContent = song.title;

  previousLine.textContent="";
  nextLine.textContent="";

  currentLine.innerHTML=
  '<span class="no-lyrics">Analisi testo M-Live...</span>';

  formatStatus.textContent=
  "Analisi MP3...";

  try{

    const buffer =
    await song.file.arrayBuffer();

    const chunks =
    parseID3SYLT(buffer);

    if(chunks.length){

      lyricLines =
      buildKaraokeLines(chunks);

      formatStatus.textContent=
      "✓ TESTO M-LIVE TROVATO — "
      + lyricLines.length
      + " righe";

      currentLine.textContent=
      "Testo karaoke caricato ✓";

    }else{

      formatStatus.textContent=
      "Nessun testo M-Live trovato";

      currentLine.innerHTML=
      '<span class="no-lyrics">Audio pronto. Questo MP3 non contiene testo karaoke riconosciuto.</span>';

    }

  }catch(error){

    console.error(error);

    formatStatus.textContent=
    "Errore analisi testo";

  }

  seek.value=0;
  currentTimeBox.textContent="00:00";

  renderLibrary();
  updateDisplay();

}


/* ID3 */

function synchsafe32(a,b,c,d){

  return (
    (a << 21) |
    (b << 14) |
    (c << 7) |
    d
  ) >>> 0;

}


function uint32be(bytes,offset){

  return (
    bytes[offset] * 16777216 +
    bytes[offset+1] * 65536 +
    bytes[offset+2] * 256 +
    bytes[offset+3]
  ) >>> 0;

}


/*
RITORNA I PEZZI ORIGINALI M-LIVE
con i loro timestamp.
*/

function parseID3SYLT(arrayBuffer){

  const bytes =
  new Uint8Array(arrayBuffer);

  if(
    bytes.length < 10 ||
    bytes[0] !== 0x49 ||
    bytes[1] !== 0x44 ||
    bytes[2] !== 0x33
  ){
    return [];
  }

  const version = bytes[3];

  const tagSize =
  synchsafe32(
    bytes[6],
    bytes[7],
    bytes[8],
    bytes[9]
  );

  let offset = 10;

  const end =
  Math.min(
    bytes.length,
    10 + tagSize
  );

  while(offset+10 <= end){

    if(bytes[offset]===0){
      break;
    }

    const frameId =
    String.fromCharCode(
      bytes[offset],
      bytes[offset+1],
      bytes[offset+2],
      bytes[offset+3]
    );

    let frameSize;

    if(version===4){

      frameSize =
      synchsafe32(
        bytes[offset+4],
        bytes[offset+5],
        bytes[offset+6],
        bytes[offset+7]
      );

    }else{

      frameSize =
      uint32be(
        bytes,
        offset+4
      );

    }

    if(
      frameSize<=0 ||
      offset+10+frameSize > bytes.length
    ){
      break;
    }

    if(frameId==="SYLT"){

      const frame =
      bytes.slice(
        offset+10,
        offset+10+frameSize
      );

      return parseSYLTChunks(frame);

    }

    offset += 10+frameSize;

  }

  return [];

}


/* SYLT M-LIVE */

function parseSYLTChunks(data){

  if(data.length < 7){
    return [];
  }

  const encoding = data[0];
  const timestampFormat = data[4];

  let pos = 6;

  /* salta "Sincro by M-live" */

  const descriptor =
  readEncodedString(
    data,
    pos,
    encoding
  );

  pos = descriptor.next;

  const chunks = [];

  while(pos < data.length){

    const lyric =
    readEncodedString(
      data,
      pos,
      encoding
    );

    pos = lyric.next;

    if(pos+4 > data.length){
      break;
    }

    const timestamp =
    uint32be(data,pos);

    pos += 4;

    let seconds;

    /*
    Nel tuo M-Live:
    02 = millisecondi.
    */

    if(timestampFormat===2){

      seconds =
      timestamp/1000;

    }else{

      /*
      fallback frame MPEG
      */

      seconds =
      timestamp/38.28125;

    }

    chunks.push({
      time:seconds,
      text:lyric.text
    });

  }

  return chunks;

}


/*
QUI È LA CORREZIONE IMPORTANTE.

M-Live inserisce "\n" quando comincia
una nuova riga.

Noi uniamo tutte le sillabe fino
al prossimo "\n".
*/

function buildKaraokeLines(chunks){

  const lines = [];

  let current = null;

  chunks.forEach(chunk=>{

    let text =
    chunk.text || "";

    const newLine =
    text.includes("\n");

    text =
    text.replace(/\r/g,"")
    .replace(/\n/g,"");

    if(newLine || !current){

      if(
        current &&
        current.chunks.length
      ){

        finishLine(current);

        if(
          isRealKaraokeLine(current)
        ){
          lines.push(current);
        }

      }

      current = {
        start:chunk.time,
        chunks:[]
      };

    }

    if(text.length){

      current.chunks.push({
        time:chunk.time,
        text:text
      });

    }

  });


  if(
    current &&
    current.chunks.length
  ){

    finishLine(current);

    if(
      isRealKaraokeLine(current)
    ){
      lines.push(current);
    }

  }

  return lines;

}


function finishLine(line){

  line.text =
  line.chunks
  .map(c=>c.text)
  .join("")
  .trim();

}


/*
TOGLIE LE RIGHE TECNICHE
M-LIVE dall'esecuzione karaoke.
*/

function isRealKaraokeLine(line){

  const text =
  (line.text || "").trim();

  if(!text){
    return false;
  }

  if(/^[-_]{5,}$/.test(text)){
    return false;
  }

  if(/^www\./i.test(text)){
    return false;
  }

  if(/^\(c\)/i.test(text)){
    return false;
  }

  if(/^".*"$/.test(text)){
    return false;
  }

  if(/^\(Ron\)$/i.test(text)){
    return false;
  }

  if(
    /Universal Music/i.test(text)
  ){
    return false;
  }

  return true;

}


/* STRINGHE */

function readEncodedString(data,start,encoding){

  if(start>=data.length){

    return{
      text:"",
      next:data.length
    };

  }


  if(
    encoding===0 ||
    encoding===3
  ){

    let end=start;

    while(
      end<data.length &&
      data[end]!==0
    ){
      end++;
    }

    return{
      text:
      decodeText(
        data.slice(start,end),
        encoding
      ),
      next:
      Math.min(
        data.length,
        end+1
      )
    };

  }


  let end=start;

  while(end+1<data.length){

    if(
      data[end]===0 &&
      data[end+1]===0
    ){
      break;
    }

    end+=2;

  }

  return{
    text:
    decodeText(
      data.slice(start,end),
      encoding
    ),

    next:
    Math.min(
      data.length,
      end+2
    )
  };

}


function decodeText(bytes,encoding){

  try{

    if(encoding===3){

      return new TextDecoder(
        "utf-8"
      ).decode(bytes);

    }

    if(encoding===2){

      return new TextDecoder(
        "utf-16be"
      ).decode(bytes);

    }

    if(encoding===1){

      if(
        bytes.length>=2 &&
        bytes[0]===0xFE &&
        bytes[1]===0xFF
      ){

        return new TextDecoder(
          "utf-16be"
        ).decode(
          bytes.slice(2)
        );

      }

      if(
        bytes.length>=2 &&
        bytes[0]===0xFF &&
        bytes[1]===0xFE
      ){

        return new TextDecoder(
          "utf-16le"
        ).decode(
          bytes.slice(2)
        );

      }

      return new TextDecoder(
        "utf-16le"
      ).decode(bytes);

    }

    return new TextDecoder(
      "windows-1252"
    ).decode(bytes);

  }catch(error){

    return "";

  }

}


/* PLAY */

playButton.addEventListener(
"click",
async ()=>{

  if(!currentSong){

    alert(
      "Seleziona prima un brano."
    );

    return;
  }

  try{

    if(audio.paused){

      await audio.play();

    }else{

      audio.pause();

    }

  }catch(error){

    console.error(error);

  }

});


audio.addEventListener("play",()=>{

  playButton.textContent=
  "⏸ PAUSA";

});


audio.addEventListener("pause",()=>{

  playButton.textContent=
  "▶ PLAY";

});


stopButton.addEventListener(
"click",
()=>{

  audio.pause();
  audio.currentTime=0;

});


back10.addEventListener(
"click",
()=>{

  audio.currentTime=
  Math.max(
    0,
    audio.currentTime-10
  );

});


forward10.addEventListener(
"click",
()=>{

  const d =
  Number.isFinite(audio.duration)
  ? audio.duration
  : 0;

  audio.currentTime=
  Math.min(
    d,
    audio.currentTime+10
  );

});


/* VOLUME */

volume.addEventListener(
"input",
()=>{

  audio.volume=
  Number(volume.value);

  volumeValue.textContent=
  Math.round(
    audio.volume*100
  )+"%";

});


/* VELOCITÀ */

speed.addEventListener(
"input",
()=>{

  audio.playbackRate=
  Number(speed.value);

  if(
    "preservesPitch"
    in audio
  ){
    audio.preservesPitch=true;
  }

  speedValue.textContent=
  audio.playbackRate
  .toFixed(2)
  +"x";

});


/* SEEK */

seek.addEventListener(
"input",
()=>{

  if(
    !Number.isFinite(
      audio.duration
    )
  ){
    return;
  }

  audio.currentTime=
  (
    Number(seek.value)/100
  )
  *
  audio.duration;

});


audio.addEventListener(
"timeupdate",
()=>{

  if(
    Number.isFinite(
      audio.duration
    ) &&
    audio.duration>0
  ){

    seek.value=
    (
      audio.currentTime/
      audio.duration
    )*100;

  }

  currentTimeBox.textContent=
  formatTime(
    audio.currentTime
  );

  durationBox.textContent=
  formatTime(
    audio.duration
  );

  updateLyrics();

});


audio.addEventListener(
"loadedmetadata",
()=>{

  durationBox.textContent=
  formatTime(
    audio.duration
  );

});


function formatTime(seconds){

  if(!Number.isFinite(seconds)){
    return "00:00";
  }

  const m=
  Math.floor(seconds/60);

  const s=
  Math.floor(seconds%60);

  return(
    String(m).padStart(2,"0")
    +
    ":"
    +
    String(s).padStart(2,"0")
  );

}


/* TROVA RIGA CORRENTE */

function getCurrentLineIndex(){

  let index=-1;

  for(
    let i=0;
    i<lyricLines.length;
    i++
  ){

    if(
      audio.currentTime >=
      lyricLines[i].start
    ){

      index=i;

    }else{

      break;

    }

  }

  return index;

}


/*
COSTRUISCE LA RIGA COLORATA.

La parte già cantata = gialla.
La parte futura = bianca.
*/

function renderHighlightedLine(line,time){

  if(!line){
    return "";
  }

  let html="";

  line.chunks.forEach(chunk=>{

    const cls =
    time >= chunk.time
    ? "sung"
    : "waiting";

    html +=
    '<span class="'
    +cls+
    '">'
    +escapeHTML(chunk.text)
    +'</span>';

  });

  return html;

}


function escapeHTML(text){

  return String(text)
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* AGGIORNA TESTO */

function updateLyrics(){

  if(!lyricLines.length){

    updateDisplay();

    return;
  }

  const index =
  getCurrentLineIndex();


  if(index<0){

    previousLine.textContent="";

    currentLine.innerHTML="♪";

    nextLine.textContent=
    lyricLines[0]?.text || "";

    updateDisplay();

    return;
  }


  previousLine.textContent=
  lyricLines[index-1]
  ?.text || "";


  currentLine.innerHTML=
  renderHighlightedLine(
    lyricLines[index],
    audio.currentTime
  );


  nextLine.textContent=
  lyricLines[index+1]
  ?.text || "";


  updateDisplay();

}

function updateDisplay(){

  if(
    !displayWindow ||
    displayWindow.closed
  ){
    return;
  }


  const title =
  displayWindow.document
  .getElementById(
    "displayTitle"
  );

  const prev =
  displayWindow.document
  .getElementById(
    "displayPrevious"
  );

  const cur =
  displayWindow.document
  .getElementById(
    "displayCurrent"
  );

  const next =
  displayWindow.document
  .getElementById(
    "displayNext"
  );


  if(title){

    title.textContent=
    currentSong
    ? currentSong.title
    : "KARAOKE LIVE SHOW";

  }


  const index =
  getCurrentLineIndex();


  if(index<0){

    prev.textContent="";

    cur.textContent="♪";

    next.textContent=
    lyricLines[0]
    ?.text || "";

    return;
  }


  prev.textContent=
  lyricLines[index-1]
  ?.text || "";


  cur.innerHTML=
  renderHighlightedLine(
    lyricLines[index],
    audio.currentTime
  );


  next.textContent=
  lyricLines[index+1]
  ?.text || "";

}
