<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Karaoke Live Show - Player</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:white;
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 10%,rgba(255,0,180,.20),transparent 30%),
    radial-gradient(circle at 85% 15%,rgba(0,180,255,.18),transparent 30%),
    linear-gradient(180deg,#07112d,#10184d,#080d29);
}

.app{
  width:min(1250px,96%);
  margin:auto;
  padding:24px 14px 50px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
  margin-bottom:22px;
}

.brand{
  color:#ffd21f;
  font-size:30px;
  font-weight:900;
}

.back{
  display:inline-block;
  padding:11px 16px;
  margin-left:6px;
  border-radius:12px;
  background:rgba(255,255,255,.10);
  color:white;
  text-decoration:none;
  font-weight:bold;
}

.grid{
  display:grid;
  grid-template-columns:350px 1fr;
  gap:22px;
}

.card{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  border-radius:22px;
  padding:20px;
}

.library-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.library-title h2{
  margin:0;
}

.file-label{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:12px 16px;
  border-radius:12px;
  cursor:pointer;
  background:#18d7e7;
  color:#04323b;
  font-weight:900;
}

#fileInput,
#klsInput,
#playlistInput,
#playlistMp3Input{
  display:none;
}

.search{
  width:100%;
  margin-top:16px;
  padding:14px;
  border:0;
  border-radius:12px;
  font-size:17px;
}

.library{
  margin-top:14px;
  max-height:500px;
  overflow:auto;
}

.song-item{
  padding:13px;
  margin:8px 0;
  border-radius:12px;
  background:rgba(255,255,255,.06);
  cursor:pointer;
  border:1px solid transparent;
}

.song-item.active{
  border-color:#ffd21f;
  background:rgba(255,210,31,.10);
}

.song-name{
  font-weight:900;
}

.song-extra{
  color:#bfc2d4;
  font-size:13px;
  margin-top:4px;
}

.kls-panel{
  margin-top:18px;
  padding-top:18px;
  border-top:1px solid rgba(255,255,255,.12);
}

.kls-panel h3{
  color:#ffd21f;
  margin:0 0 12px;
}

.kls-buttons{
  display:grid;
  gap:9px;
}

.kls-open{
  background:#7c4dff;
  color:white;
}

.kls-save{
  background:#ff259d;
  color:white;
}

.playlist-box{
  margin-top:12px;
}

.playlist-row{
  padding:12px;
  margin:8px 0;
  border-radius:12px;
  background:rgba(255,255,255,.06);
}

.playlist-row.active{
  border:1px solid #ffd21f;
}

.playlist-actions{
  display:flex;
  gap:6px;
  margin-top:8px;
  flex-wrap:wrap;
}

.now{
  text-align:center;
}

.now-label{
  color:#adb0c6;
  font-size:13px;
  font-weight:bold;
}

.now-title{
  margin-top:7px;
  color:#ffd21f;
  font-size:30px;
  font-weight:900;
}

.time{
  display:flex;
  justify-content:space-between;
  margin-top:24px;
  color:#cfd1df;
}

#seek{
  width:100%;
}

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin-top:20px;
  flex-wrap:wrap;
}

button{
  border:0;
  border-radius:13px;
  padding:13px 17px;
  font-weight:900;
  font-size:15px;
  cursor:pointer;
}

.control{
  background:rgba(255,255,255,.10);
  color:white;
}

.play{
  background:#52ff8a;
  color:#052d14;
  font-size:20px;
  min-width:110px;
}

.stop{
  background:#ff315d;
  color:white;
}

.display{
  background:#ffd21f;
  color:#2b2200;
}

.full{
  background:#7c4dff;
  color:white;
}

.pitch-box{
  margin-top:22px;
  background:rgba(255,255,255,.05);
  border-radius:16px;
  padding:18px;
  text-align:center;
}

.pitch-title{
  color:#ffd21f;
  font-size:18px;
  font-weight:900;
  margin-bottom:14px;
}

.pitch-controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

.pitch-minus{
  background:#147cff;
  color:white;
  font-size:24px;
  min-width:80px;
}

.pitch-plus{
  background:#ff259d;
  color:white;
  font-size:24px;
  min-width:80px;
}

.pitch-reset{
  background:#ffd21f;
  color:#281f00;
}

.pitch-number{
  font-size:34px;
  font-weight:900;
  min-width:90px;
}

.pitch-status{
  margin-top:9px;
  color:#bfc2d4;
  font-size:13px;
}

.options{
  margin-top:22px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.option{
  background:rgba(255,255,255,.05);
  border-radius:14px;
  padding:14px;
}

.option label{
  display:block;
  color:#ffd21f;
  font-weight:bold;
  margin-bottom:8px;
}

.option input{
  width:100%;
}

.value{
  text-align:center;
  margin-top:6px;
  font-weight:bold;
}

.lyrics{
  margin-top:22px;
  min-height:300px;
  border-radius:20px;
  background:#03040a;
  border:1px solid rgba(255,255,255,.10);
  padding:24px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  text-align:center;
  overflow:hidden;
}

.previous-line,
.next-line{
  color:#707486;
  font-size:22px;
  min-height:34px;
}

.current-line{
  color:white;
  font-size:44px;
  line-height:1.25;
  font-weight:900;
  margin:22px 0;
  min-height:60px;
}

.sung{
  color:#ffd21f;
  text-shadow:0 0 14px rgba(255,210,31,.35);
}

.waiting{
  color:white;
}

.no-lyrics{
  color:#9ca0b4;
  font-size:18px;
}

.status{
  margin-top:12px;
  text-align:center;
  color:#52ff8a;
  font-weight:bold;
  min-height:22px;
}

@media(max-width:850px){
  .grid{grid-template-columns:1fr}
  .library{max-height:260px}
  .options{grid-template-columns:1fr}
  .current-line{font-size:30px}
}
</style>
</head>

<body>

<div class="app">

<div class="topbar">

  <div class="brand">
    🎤 KARAOKE LIVE SHOW — PLAYER
  </div>

  <div>
    <a class="back" href="admin.html">← ADMIN</a>
    <a class="back" href="sito.html">🌐 SITO</a>
  </div>

</div>

<div class="grid">

<!-- LIBRERIA -->

<div class="card">

  <div class="library-title">

    <h2>🎵 Libreria</h2>

    <label class="file-label">
      + CARICA MP3
      <input
      id="fileInput"
      type="file"
      multiple
      accept=".mp3,audio/mpeg">
    </label>

  </div>

  <input
  id="search"
  class="search"
  placeholder="Cerca canzone...">

  <div id="library" class="library">
    <div class="song-extra">
      Carica uno o più MP3.
    </div>
  </div>

  <div class="kls-panel">

    <h3>💾 FILE KLS</h3>

    <div class="kls-buttons">

      <label class="file-label kls-open">
        📂 APRI KLS
        <input
        id="klsInput"
        type="file"
        accept=".kls,application/json">
      </label>

      <button
      class="kls-save"
      id="saveKlsButton">
        💾 SALVA COME KLS
      </button>

    </div>


    <h3 style="margin-top:24px">
      🎶 PLAYLIST
    </h3>

    <input
    id="playlistName"
    class="search"
    placeholder="Nome playlist">

    <div class="kls-buttons">

      <button
      class="kls-save"
      id="addPlaylistButton">
        ➕ AGGIUNGI BRANO
      </button>

      <button
      class="kls-open"
      id="savePlaylistButton">
        💾 SALVA PLAYLIST
      </button>

      <label class="file-label kls-open">
        📂 APRI PLAYLIST
        <input
        id="playlistInput"
        type="file"
        accept=".kpl,application/json">
      </label>

      <label class="file-label">
        🎵 ASSOCIA MP3
        <input
        id="playlistMp3Input"
        type="file"
        multiple
        accept=".mp3,audio/mpeg">
      </label>

    </div>

    <label
    style="
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:14px;
    ">

      <input
      id="autoNext"
      type="checkbox">

      ▶ AUTO NEXT

    </label>

    <div
    id="playlistBox"
    class="playlist-box">
    </div>

  </div>

</div>


<!-- PLAYER -->

<div class="card">

  <div class="now">

    <div class="now-label">
      BRANO IN RIPRODUZIONE
    </div>

    <div
    class="now-title"
    id="nowTitle">
      Nessun brano
    </div>

  </div>

  <audio
  id="audio"
  preload="metadata">
  </audio>

  <div class="time">

    <span id="currentTime">
      00:00
    </span>

    <span id="duration">
      00:00
    </span>

  </div>

  <input
  id="seek"
  type="range"
  min="0"
  max="100"
  step="0.1"
  value="0">

  <div class="controls">

    <button
    class="control"
    id="back10">
      ⏪ 10s
    </button>

    <button
    class="play"
    id="playButton">
      ▶ PLAY
    </button>

    <button
    class="control"
    id="forward10">
      10s ⏩
    </button>

    <button
    class="stop"
    id="stopButton">
      ■ STOP
    </button>

    <button
    class="display"
    id="displayButton">
      🖥 DISPLAY 2
    </button>

    <button
    class="full"
    id="fullscreenButton">
      ⛶ SCHERMO INTERO
    </button>

  </div>


  <!-- TONALITÀ -->

  <div class="pitch-box">

    <div class="pitch-title">
      🎼 TONALITÀ
    </div>

    <div class="pitch-controls">

      <button
      class="pitch-minus"
      id="pitchMinus">
        −
      </button>

      <div
      class="pitch-number"
      id="pitchNumber">
        0
      </div>

      <button
      class="pitch-plus"
      id="pitchPlus">
        +
      </button>

      <button
      class="pitch-reset"
      id="pitchReset">
        RESET 0
      </button>

    </div>

    <div
    class="pitch-status"
    id="pitchStatus">

      Tonalità originale

    </div>

  </div>


  <!-- VOLUME / VELOCITÀ -->

  <div class="options">

    <div class="option">

      <label>
        🔊 Volume
      </label>

      <input
      id="volume"
      type="range"
      min="0"
      max="1"
      step="0.01"
      value="1">

      <div
      class="value"
      id="volumeValue">
        100%
      </div>

    </div>


    <div class="option">

      <label>
        ⚡ Velocità
      </label>

      <input
      id="speed"
      type="range"
      min="0.70"
      max="1.30"
      step="0.05"
      value="1">

      <div
      class="value"
      id="speedValue">
        1.00x
      </div>

    </div>

  </div>


  <!-- TESTO -->

  <div class="lyrics">

    <div
    class="previous-line"
    id="previousLine">
    </div>

    <div
    class="current-line"
    id="currentLine">

      <span class="no-lyrics">
        Carica un MP3 SongService.
      </span>

    </div>

    <div
    class="next-line"
    id="nextLine">
    </div>

  </div>

  <div
  class="status"
  id="status">
    In attesa...
  </div>

</div>

</div>

</div>


<script>

/* ==============================
   ELEMENTI
================================ */

const audio =
document.getElementById("audio");

const fileInput =
document.getElementById("fileInput");

const klsInput =
document.getElementById("klsInput");

const saveKlsButton =
document.getElementById("saveKlsButton");

const playlistInput =
document.getElementById("playlistInput");

const playlistMp3Input =
document.getElementById("playlistMp3Input");

const playlistName =
document.getElementById("playlistName");

const playlistBox =
document.getElementById("playlistBox");

const addPlaylistButton =
document.getElementById("addPlaylistButton");

const savePlaylistButton =
document.getElementById("savePlaylistButton");

const autoNext =
document.getElementById("autoNext");

const library =
document.getElementById("library");

const search =
document.getElementById("search");

const nowTitle =
document.getElementById("nowTitle");

const playButton =
document.getElementById("playButton");

const stopButton =
document.getElementById("stopButton");

const back10 =
document.getElementById("back10");

const forward10 =
document.getElementById("forward10");

const seek =
document.getElementById("seek");

const currentTimeBox =
document.getElementById("currentTime");

const durationBox =
document.getElementById("duration");

const volume =
document.getElementById("volume");

const volumeValue =
document.getElementById("volumeValue");

const speed =
document.getElementById("speed");

const speedValue =
document.getElementById("speedValue");

const pitchMinus =
document.getElementById("pitchMinus");

const pitchPlus =
document.getElementById("pitchPlus");

const pitchReset =
document.getElementById("pitchReset");

const pitchNumber =
document.getElementById("pitchNumber");

const pitchStatus =
document.getElementById("pitchStatus");

const displayButton =
document.getElementById("displayButton");

const fullscreenButton =
document.getElementById("fullscreenButton");

const previousLine =
document.getElementById("previousLine");

const currentLine =
document.getElementById("currentLine");

const nextLine =
document.getElementById("nextLine");

const status =
document.getElementById("status");


/* ==============================
   STATO
================================ */

let songs = [];

let currentSong = null;

let lyricLines = [];

let displayWindow = null;

let pitchSemitones = 0;

let pendingKls = null;

let playlist = [];

let currentPlaylistIndex = -1;


/* ==============================
   TONALITÀ
================================ */

function showPitch(){

  pitchNumber.textContent =
  pitchSemitones > 0
  ?
  "+" + pitchSemitones
  :
  String(pitchSemitones);


  pitchStatus.textContent =
  pitchSemitones === 0
  ?
  "Tonalità originale"
  :
  "Tonalità "
  +
  (
    pitchSemitones > 0
    ?
    "+"
    +
    pitchSemitones
    :
    pitchSemitones
  )
  +
  " semitoni";


  updateDisplay();

}


function setPitch(value){

  pitchSemitones =
  Math.max(
    -6,
    Math.min(
      6,
      Number(value)
    )
  );


  showPitch();

}


pitchMinus.addEventListener(
"click",
()=>{

  setPitch(
    pitchSemitones - 1
  );

});


pitchPlus.addEventListener(
"click",
()=>{

  setPitch(
    pitchSemitones + 1
  );

});


pitchReset.addEventListener(
"click",
()=>{

  setPitch(0);

});


/* ==============================
   LIBRERIA
================================ */

function cleanName(name){

  return name
  .replace(
    /\.[^/.]+$/,
    ""
  )
  .trim();

}


function addMp3File(file){

  if(
    !file.name
    .toLowerCase()
    .endsWith(".mp3")
  ){

    return;

  }


  if(
    songs.some(
      s =>
      s.file.name ===
      file.name
    )
  ){

    return;

  }


  songs.push({

    id:
    Date.now()
    +
    Math.random(),

    title:
    cleanName(
      file.name
    ),

    file:
    file,

    url:
    URL.createObjectURL(
      file
    )

  });

}


fileInput.addEventListener(
"change",
()=>{

  const files =
  Array.from(
    fileInput.files
  );


  files.forEach(
    addMp3File
  );


  renderLibrary();


  if(
    pendingKls
  ){

    const song =
    songs.find(
      s =>
      s.file.name ===
      pendingKls.song.filename
    );


    if(song){

      applyKlsToSong(
        pendingKls,
        song
      );

      pendingKls =
      null;

    }

  }

});


search.addEventListener(
"input",
renderLibrary
);


function renderLibrary(){

  const query =
  search.value
  .toLowerCase()
  .trim();


  library.innerHTML="";


  const list =
  songs.filter(
    song =>
    song.title
    .toLowerCase()
    .includes(query)
  );


  if(!list.length){

    library.innerHTML=
    '<div class="song-extra">Nessun brano.</div>';

    return;

  }


  list.forEach(song=>{

    const item =
    document.createElement(
      "div"
    );


    item.className =
    "song-item";


    if(
      currentSong
      &&
      currentSong.id ===
      song.id
    ){

      item.classList.add(
        "active"
      );

    }


    item.innerHTML =
    '<div class="song-name">'
    +
    '🎵 '
    +
    escapeHTML(
      song.title
    )
    +
    '</div>'
    +
    '<div class="song-extra">'
    +
    'MP3 SongService / M-Live'
    +
    '</div>';


    item.addEventListener(
      "click",
      ()=>loadSong(song)
    );


    library.appendChild(
      item
    );

  });

}


/* ==============================
   CARICA BRANO
================================ */

async function loadSong(
song,
keepSettings=false
){

  audio.pause();


  currentSong =
  song;


  lyricLines = [];


  audio.src =
  song.url;


  audio.load();


  nowTitle.textContent =
  song.title;


  if(
    !keepSettings
  ){

    setPitch(0);

    speed.value =
    1;

    speedValue.textContent =
    "1.00x";

  }


  previousLine.textContent =
  "";


  currentLine.textContent =
  "Analisi testo...";


  nextLine.textContent =
  "";


  status.textContent =
  "Ricerca testo SongService...";


  try{

    const buffer =
    await song.file.arrayBuffer();


    const chunks =
    parseSongServiceSYLT(
      buffer
    );


    if(
      chunks.length
    ){

      lyricLines =
      buildLines(
        chunks
      );


      status.textContent =
      "✓ TESTO TROVATO — "
      +
      lyricLines.length
      +
      " righe";


      currentLine.textContent =
      "TESTO CARICATO ✓";


    }else{

      status.textContent =
      "Questo MP3 non contiene testo karaoke riconosciuto.";


      currentLine.innerHTML =
      '<span class="no-lyrics">Nessun testo sincronizzato.</span>';

    }


  }catch(error){

    console.error(error);


    status.textContent =
    "Errore durante la lettura.";

  }


  seek.value =
  0;


  currentTimeBox.textContent =
  "00:00";


  renderLibrary();


  updateDisplay();

}


/* ==============================
   KLS
================================ */

saveKlsButton.addEventListener(
"click",
()=>{

  if(
    !currentSong
  ){

    alert(
      "Seleziona prima un MP3."
    );

    return;

  }


  const data = {

    format:
    "KLS",

    version:
    1,

    app:
    "Karaoke Live Show",

    song:{

      filename:
      currentSong.file.name,

      title:
      currentSong.title,

      size:
      currentSong.file.size

    },

    settings:{

      pitchSemitones:
      pitchSemitones,

      speed:
      Number(
        speed.value
      ),

      volume:
      Number(
        volume.value
      )

    }

  };


  downloadJsonFile(
    data,
    safeFileName(
      currentSong.title
    )
    +
    ".kls"
  );


  status.textContent =
  "✓ File KLS salvato";

});


klsInput.addEventListener(
"change",
async ()=>{

  const file =
  klsInput.files[0];


  if(!file){
    return;
  }


  try{

    const data =
    JSON.parse(
      await file.text()
    );


    if(
      data.format !==
      "KLS"
      ||
      !data.song
    ){

      throw new Error(
        "KLS non valido"
      );

    }


    const existing =
    songs.find(
      s =>
      s.file.name ===
      data.song.filename
    );


    if(existing){

      await applyKlsToSong(
        data,
        existing
      );


    }else{

      pendingKls =
      data;


      status.textContent =
      "KLS aperto. Adesso carica MP3: "
      +
      data.song.filename;


      alert(
        "KLS aperto.\n\n"
        +
        "Adesso premi CARICA MP3 e scegli:\n"
        +
        data.song.filename
      );

    }


  }catch(error){

    console.error(error);


    alert(
      "Questo file KLS non è valido."
    );

  }


  klsInput.value =
  "";

});


async function applyKlsToSong(
data,
song
){

  await loadSong(
    song,
    true
  );


  const settings =
  data.settings
  ||
  {};


  const savedPitch =
  Number(
    settings.pitchSemitones
    ||
    0
  );


  const savedSpeed =
  Number(
    settings.speed
    ||
    1
  );


  const savedVolume =
  Number(
    settings.volume
    ??
    1
  );


  setPitch(
    savedPitch
  );


  speed.value =
  savedSpeed;


  audio.playbackRate =
  savedSpeed;


  speedValue.textContent =
  savedSpeed
  .toFixed(2)
  +
  "x";


  volume.value =
  savedVolume;


  audio.volume =
  savedVolume;


  volumeValue.textContent =
  Math.round(
    savedVolume*100

/* ==============================
   PARSER SONGSERVICE
================================ */

function uint32be(
bytes,
offset
){

  return (
    bytes[offset]
    * 16777216
    +
    bytes[offset+1]
    * 65536
    +
    bytes[offset+2]
    * 256
    +
    bytes[offset+3]
  ) >>> 0;

}


function parseSongServiceSYLT(
arrayBuffer
){

  const bytes =
  new Uint8Array(
    arrayBuffer
  );


  let frameStart =
  -1;


  for(
    let i=0;
    i<bytes.length-4;
    i++
  ){

    if(
      bytes[i]===0x53
      &&
      bytes[i+1]===0x59
      &&
      bytes[i+2]===0x4C
      &&
      bytes[i+3]===0x54
    ){

      frameStart =
      i;

      break;

    }

  }


  if(
    frameStart < 0
  ){

    return [];

  }


  const frameSize =
  uint32be(
    bytes,
    frameStart+4
  );


  const start =
  frameStart + 10;


  const end =
  Math.min(
    bytes.length,
    start + frameSize
  );


  const data =
  bytes.slice(
    start,
    end
  );


  let pos =
  0;


  const encoding =
  data[pos++];


  if(
    data[pos] === 0x00
    &&
    data[pos+1] === 0x58
    &&
    data[pos+2] === 0x58
    &&
    data[pos+3] === 0x58
  ){

    pos++;

  }


  pos += 3;


  const timestampFormat =
  data[pos++];


  pos++;


  while(
    pos < data.length
    &&
    data[pos] !== 0
  ){

    pos++;

  }


  pos++;


  const chunks =
  [];


  while(
    pos < data.length
  ){

    const textStart =
    pos;


    while(
      pos < data.length
      &&
      data[pos] !== 0
    ){

      pos++;

    }


    if(
      pos >= data.length
    ){

      break;

    }


    const textBytes =
    data.slice(
      textStart,
      pos
    );


    pos++;


    if(
      pos + 4 >
      data.length
    ){

      break;

    }


    const timestamp =
    uint32be(
      data,
      pos
    );


    pos += 4;


    const text =
    new TextDecoder(
      encoding === 3
      ?
      "utf-8"
      :
      "windows-1252"
    )
    .decode(
      textBytes
    );


    let seconds;


    if(
      timestampFormat === 2
    ){

      seconds =
      timestamp / 1000;

    }else{

      seconds =
      timestamp / 38.28125;

    }


    chunks.push({

      time:
      seconds,

      text:
      text

    });

  }


  return chunks;

}


/* ==============================
   RIGHE KARAOKE
================================ */

function buildLines(
chunks
){

  const lines =
  [];


  let line =
  null;


  chunks.forEach(
  chunk=>{

    let text =
    chunk.text
    ||
    "";


    const beginsNewLine =
    text.includes(
      "\n"
    );


    text =
    text
    .replace(
      /\r/g,
      ""
    )
    .replace(
      /\n/g,
      ""
    );


    if(
      beginsNewLine
      ||
      !line
    ){

      if(
        line
      ){

        finishLine(
          line
        );


        if(
          validLine(
            line.text
          )
        ){

          lines.push(
            line
          );

        }

      }


      line = {

        start:
        chunk.time,

        chunks:[]

      };

    }


    if(
      text
    ){

      line.chunks.push({

        time:
        chunk.time,

        text:
        text

      });

    }

  });


  if(
    line
  ){

    finishLine(
      line
    );


    if(
      validLine(
        line.text
      )
    ){

      lines.push(
        line
      );

    }

  }


  return lines;

}


function finishLine(
line
){

  line.text =
  line.chunks
  .map(
    x =>
    x.text
  )
  .join("")
  .trim();

}


function validLine(
text
){

  const t =
  String(
    text
    ||
    ""
  )
  .trim();


  if(!t){
    return false;
  }


  if(
    t.includes(
      "www.songservice.it"
    )
  ){

    return false;

  }


  if(
    t.includes(
      "Universal Music"
    )
  ){

    return false;

  }


  if(
    /^[-_]{5,}$/
    .test(t)
  ){

    return false;

  }


  return true;

}


/* ==============================
   TESTO LIVE
================================ */

function getLineIndex(){

  let index =
  -1;


  for(
    let i=0;
    i<lyricLines.length;
    i++
  ){

    if(
      audio.currentTime >=
      lyricLines[i].start
    ){

      index =
      i;

    }else{

      break;

    }

  }


  return index;

}


function renderCurrentLine(
line,
time
){

  if(!line){
    return "";
  }


  let html =
  "";


  line.chunks.forEach(
  chunk=>{

    const cls =
    time >=
    chunk.time
    ?
    "sung"
    :
    "waiting";


    html +=
    '<span class="'
    +
    cls
    +
    '">'
    +
    escapeHTML(
      chunk.text
    )
    +
    '</span>';

  });


  return html;

}


function updateLyrics(){

  if(
    !lyricLines.length
  ){

    updateDisplay();

    return;

  }


  const index =
  getLineIndex();


  if(
    index < 0
  ){

    previousLine.textContent =
    "";


    currentLine.textContent =
    "♪";


    nextLine.textContent =
    lyricLines[0]
    ?.text
    ||
    "";


    updateDisplay();

    return;

  }


  previousLine.textContent =
  lyricLines[index-1]
  ?.text
  ||
  "";


  currentLine.innerHTML =
  renderCurrentLine(
    lyricLines[index],
    audio.currentTime
  );


  nextLine.textContent =
  lyricLines[index+1]
  ?.text
  ||
  "";


  updateDisplay();

}

function formatTime(
seconds
){

  if(
    !Number.isFinite(
      seconds
    )
  ){

    return "00:00";

  }


  const m =
  Math.floor(
    seconds / 60
  );


  const s =
  Math.floor(
    seconds % 60
  );


  return (
    String(m)
    .padStart(
      2,
      "0"
    )
    +
    ":"
    +
    String(s)
    .padStart(
      2,
      "0"
    )
  );

}

/* ==============================
   UTILITY
================================ */

function safeFileName(
name
){

  return String(name)
  .replace(
    /[\\/:*?"<>|]/g,
    "_"
  )
  .trim();

}


function downloadJsonFile(
data,
filename
){

  const blob =
  new Blob(
    [
      JSON.stringify(
        data,
        null,
        2
      )
    ],
    {
      type:
      "application/json"
    }
  );


  const url =
  URL.createObjectURL(
    blob
  );


  const a =
  document.createElement(
    "a"
  );


  a.href =
  url;


  a.download =
  filename;


  document.body
  .appendChild(a);


  a.click();


  a.remove();


  setTimeout(
    ()=>{
      URL.revokeObjectURL(
        url
      );
    },
    1000
  );

}


function escapeHTML(
text
){

  return String(text)
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}
